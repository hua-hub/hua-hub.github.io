<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>调式识别与查询器</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F2F2F7;
            --key-active-color: #34C759;
            --text-main: #1C1C1E;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
        }

        /* 顶部导航与查询区 */
        .header {
            padding: 10px 15px;
            background: #fff;
            box-shadow: 0 1px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .header h1 { font-size: 18px; font-weight: 700; }

        /* 查询控制台 */
        .lookup-controls {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #f8f8f8;
            padding: 8px;
            border-radius: 10px;
        }

        select {
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ddd;
            font-size: 14px;
            background: white;
            flex: 1;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .apply-btn { background: var(--primary-color); color: white; }
        .reset-btn { background: rgba(0, 122, 255, 0.1); color: var(--primary-color); }

        /* 结果展示区 */
        .display-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            align-content: flex-start;
        }

        .empty-prompt {
            grid-column: 1 / -1;
            text-align: center;
            color: #8E8E93;
            margin-top: 40px;
            font-size: 14px;
        }

        .mode-card {
            background: #fff;
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid #E5E5EA;
        }

        .mode-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .staff-svg { width: 100%; height: auto; background: #fdfdfd; border-radius: 4px; }

        /* 键盘区 */
        .keyboard-area {
            height: 220px;
            background: #111;
            position: relative;
            display: flex;
            padding: 5px 2px 15px 2px;
            border-top: 2px solid #333;
        }

        .key { position: relative; cursor: pointer; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px; font-weight: 600; }
        .key.white { flex: 1; background: #fff; border: 1px solid #ccc; border-radius: 0 0 6px 6px; z-index: 1; color: #888; font-size: 11px; }
        .key.white.active { background: var(--key-active-color); color: #fff; border-color: var(--key-active-color); }
        .key.black { 
            position: absolute; width: 9%; height: 60%; background: #222; z-index: 2; 
            transform: translateX(-50%); border-radius: 0 0 4px 4px; color: #fff; font-size: 9px; 
            box-shadow: inset 0 -4px 0 rgba(255,255,255,0.1);
        }
        .key.black.active { background: var(--key-active-color); box-shadow: none; }

        .black.c-sharp { left: 14.28%; }
        .black.d-sharp { left: 28.57%; }
        .black.f-sharp { left: 57.14%; }
        .black.g-sharp { left: 71.42%; }
        .black.a-sharp { left: 85.71%; }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-top">
            <h1>调式识别与查询</h1>
            <button class="btn reset-btn" id="resetBtn">清空重置</button>
        </div>
        
        <div class="lookup-controls">
            <select id="rootSelect"></select>
            <select id="typeSelect"></select>
            <button class="btn apply-btn" id="applyBtn">标注按键</button>
        </div>
    </div>

    <div class="display-area" id="displayArea">
        <div class="empty-prompt">点击键盘或使用上方查询功能</div>
    </div>

    <div class="keyboard-area" id="keyboard">
        <div class="key white" data-note="0">C</div>
        <div class="key white" data-note="2">D</div>
        <div class="key white" data-note="4">E</div>
        <div class="key white" data-note="5">F</div>
        <div class="key white" data-note="7">G</div>
        <div class="key white" data-note="9">A</div>
        <div class="key white" data-note="11">B</div>
        <div class="key black c-sharp" data-note="1">C#</div>
        <div class="key black d-sharp" data-note="3">D#</div>
        <div class="key black f-sharp" data-note="6">F#</div>
        <div class="key black g-sharp" data-note="8">G#</div>
        <div class="key black a-sharp" data-note="10">A#</div>
    </div>

<script>
    // --- 1. 核心数据定义 ---
    const MAJOR_KEY_SIGS = { 0:0, 7:1, 2:2, 9:3, 4:4, 11:5, 6:6, 5:-1, 10:-2, 3:-3, 8:-4, 1:-5 };
    const scaleTypes = [
        { name: '大调 (Ionian)', intervals: [0, 2, 4, 5, 7, 9, 11], rootOffset: 0 },
        { name: '自然小调 (Aeolian)', intervals: [0, 2, 3, 5, 7, 8, 10], rootOffset: 3 },
        // { name: '和声小调', intervals: [0, 2, 3, 5, 7, 8, 11], rootOffset: 3 },
        // { name: '旋律小调', intervals: [0, 2, 3, 5, 7, 9, 11], rootOffset: 3 },
        // { name: 'Dorian', intervals: [0, 2, 3, 5, 7, 9, 10], rootOffset: 10 },
        // { name: 'Mixolydian', intervals: [0, 2, 4, 5, 7, 9, 10], rootOffset: 5 }
    ];

    const noteNamesSharp = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
    const noteNamesFlat = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
    const USE_FLATS = [5, 10, 3, 8, 1]; 

    const allScales = [];
    for (let r = 0; r < 12; r++) {
        const useFlat = USE_FLATS.includes(r);
        const names = useFlat ? noteNamesFlat : noteNamesSharp;
        scaleTypes.forEach((type, tIdx) => {
            const majorRoot = (r + type.rootOffset) % 12;
            const sigCount = MAJOR_KEY_SIGS[majorRoot] || 0;
            allScales.push({
                id: `${r}-${tIdx}`,
                root: r,
                rootName: names[r],
                typeName: type.name,
                fullName: `${names[r]} ${type.name}`,
                notes: type.intervals.map(i => (r + i) % 12),
                sig: sigCount
            });
        });
    }

    // --- 2. 初始化下拉菜单 ---
    const rootSelect = document.getElementById('rootSelect');
    const typeSelect = document.getElementById('typeSelect');
    
    noteNamesSharp.forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = name + (USE_FLATS.includes(i) ? '/' + noteNamesFlat[i] : '');
        rootSelect.appendChild(opt);
    });

    scaleTypes.forEach((type, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = type.name;
        typeSelect.appendChild(opt);
    });

    // --- 3. 绘图逻辑 (SVG 调号) ---
    function createKeySigSVG(sigCount) {
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", "0 0 200 80");
        svg.classList.add("staff-svg");
        for (let i = 0; i < 5; i++) {
            const line = document.createElementNS(NS, "line");
            const y = 20 + i * 10;
            line.setAttribute("x1", "0"); line.setAttribute("y1", y); line.setAttribute("x2", "200"); line.setAttribute("y2", y);
            line.setAttribute("stroke", "#000"); svg.appendChild(line);
        }
        const clef = document.createElementNS(NS, "text");
        clef.setAttribute("x", "10"); clef.setAttribute("y", "52"); clef.setAttribute("font-size", "45px");
        clef.textContent = "𝄞"; svg.appendChild(clef);

        const isSharp = sigCount > 0;
        const count = Math.abs(sigCount);
        const symbol = isSharp ? "♯" : "♭";
        const yCoords = isSharp ? [25, 40, 20, 35, 50, 30, 45] : [35, 25, 40, 30, 45, 35, 50];
        for (let i = 0; i < count; i++) {
            const txt = document.createElementNS(NS, "text");
            txt.setAttribute("x", 55 + i * 12); txt.setAttribute("y", yCoords[i]);
            txt.setAttribute("font-size", "22px"); txt.setAttribute("font-weight", "bold");
            txt.textContent = symbol; svg.appendChild(txt);
        }
        return svg;
    }

    // --- 4. 交互逻辑 ---
    let selectedNotes = new Set();
    const displayArea = document.getElementById('displayArea');
    const keys = document.querySelectorAll('.key');

    function updateUI() {
        if (selectedNotes.size === 0) {
            displayArea.innerHTML = '<div class="empty-prompt">点击键盘或使用上方查询功能</div>';
            return;
        }
        const matched = allScales.filter(s => [...selectedNotes].every(n => s.notes.includes(n)));
        displayArea.innerHTML = matched.length ? '' : '<div class="empty-prompt">未找到匹配调式</div>';
        matched.forEach(s => {
            const card = document.createElement('div');
            card.className = 'mode-card';
            card.innerHTML = `<div class="mode-name">${s.fullName}</div>`;
            card.appendChild(createKeySigSVG(s.sig));
            displayArea.appendChild(card);
        });
    }

    // 功能：根据查询选择标注按键
    document.getElementById('applyBtn').addEventListener('click', () => {
        const root = parseInt(rootSelect.value);
        const typeIdx = parseInt(typeSelect.value);
        const targetScale = allScales.find(s => s.root === root && s.typeName === scaleTypes[typeIdx].name);
        
        if (targetScale) {
            selectedNotes = new Set(targetScale.notes);
            keys.forEach(key => {
                const noteVal = parseInt(key.getAttribute('data-note'));
                if (selectedNotes.has(noteVal)) {
                    key.classList.add('active');
                } else {
                    key.classList.remove('active');
                }
            });
            updateUI();
        }
    });

    // 钢琴按键点击
    keys.forEach(key => {
        key.addEventListener('mousedown', function() {
            const noteIdx = parseInt(this.getAttribute('data-note'));
            playNote(261.63 * Math.pow(2, noteIdx / 12));
            if (selectedNotes.has(noteIdx)) {
                selectedNotes.delete(noteIdx);
                this.classList.remove('active');
            } else {
                selectedNotes.add(noteIdx);
                this.classList.add('active');
            }
            updateUI();
        });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
        selectedNotes.clear();
        keys.forEach(k => k.classList.remove('active'));
        updateUI();
    });

    // 简单的音频播放
    let audioCtx = null;
    function playNote(freq) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.8);
    }
</script>
</body>
</html>
