<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的项目主页</title>
<style>
  :root{
    --bg:#f2f2ef; --panel:#fafaf8; --card:#fff; --text:#1a1a1a; --muted:#7a7a75; --border:#e4e4df; --hover:#3498db;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121212; --panel:#191919; --card:#222222; --text:#f2f2f2; --muted:#888; --border:#2c2c2c; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.5;
  }

  main{ max-width:840px; margin:0 auto; padding:28px 20px 24px; }
  header{ margin-bottom:20px; padding:0 4px; }
  h1{ font-size:22px; margin:0 0 2px; }
  .sub{ color:var(--muted); font-size:13px; margin:0; }

  /* 独立背景区块 */
  section.group{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px 16px;
    margin-bottom:14px;
  }
  .group-title{
    font-size:13px; font-weight:600; color:var(--muted);
    margin:0 0 10px 2px; letter-spacing:0.3px;
  }

  /* 区域内的双列/三列紧凑网格 */
  ul{
    list-style:none; padding:0; margin:0;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:8px;
  }
  li a{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 13px;
    background:var(--card); border:1px solid var(--border); border-radius:9px;
    color:inherit; text-decoration:none; font-weight:500; font-size:14.5px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    -webkit-tap-highlight-color:transparent;
    transition:border-color 0.15s, color 0.15s, transform 0.1s;
  }
  li a::after{ content:"\203A"; color:var(--muted); font-size:17px; margin-left:8px; flex:none; }
  li a:hover, li a:active{ border-color:var(--hover); color:var(--hover); }

  footer{ text-align:center; color:var(--muted); font-size:12px; margin-top:24px; }

  @media (max-width:600px){
    main{ padding:20px 14px; }
    section.group{ padding:12px; border-radius:12px; }
    ul{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>欢迎回来</h1>
    <p class="sub">请选择你要访问的模块</p>
  </header>

  <div id="nav">
    <!-- AUTO:START -->
    <section class="group">
      <h2 class="group-title">小工具</h2>
      <ul>
        <li><a href="小工具/一天时间分布图.html" title="一天时间分布图">一天时间分布图</a></li>
      </ul>
    </section>
    <section class="group">
      <h2 class="group-title">小游戏</h2>
      <ul>
        <li><a href="小游戏/记忆翻牌配对.html" title="记忆翻牌配对">记忆翻牌配对</a></li>
      </ul>
    </section>
    <section class="group">
      <h2 class="group-title">钢琴调式</h2>
      <ul>
        <li><a href="钢琴调式/钢琴调式1.html" title="钢琴调式1">钢琴调式1</a></li>
        <li><a href="钢琴调式/钢琴调式2.html" title="钢琴调式2">钢琴调式2</a></li>
        <li><a href="钢琴调式/钢琴调式3.html" title="钢琴调式3">钢琴调式3</a></li>
      </ul>
    </section>
    <section class="group">
      <h2 class="group-title">魔方</h2>
      <ul>
        <li><a href="魔方/Muse-公式练习器.html" title="Muse-公式练习器">Muse-公式练习器</a></li>
        <li><a href="魔方/Muse-十字交互训练器.html" title="Muse-十字交互训练器">Muse-十字交互训练器</a></li>
      </ul>
    </section>
    <!-- AUTO:END -->
  </div>

  <footer>&copy; 2026 我的本地工作站</footer>
</main>
</body>
</html>
