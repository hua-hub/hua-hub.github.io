<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的项目主页</title>
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --text:#1a1a1a; --muted:#999; --border:#e6e6e1; --hover:#3498db;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121212; --card:#1e1e1e; --text:#f2f2f2; --muted:#888; --border:#2d2d2d; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.6;
  }

  /* 内容列：电脑/平板居中限制宽度，手机占满，三端同一种竖排布局 */
  main{ max-width:680px; margin:0 auto; padding:48px 20px 32px; }
  h1{ font-size:26px; margin:0 0 6px; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 24px; }

  /* 每行一个，整行可点 */
  ul{ list-style:none; padding:0; margin:0; }
  li{ margin:0 0 10px; }
  li a{
    display:flex; justify-content:space-between; align-items:center;
    min-height:56px; padding:14px 18px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    color:inherit; text-decoration:none; font-weight:600; font-size:17px;
    word-break:break-all; -webkit-tap-highlight-color:transparent;
  }
  li a::after{ content:"\203A"; color:var(--muted); font-size:22px; margin-left:12px; flex:none; }
  li a:hover, li a:active{ border-color:var(--hover); color:var(--hover); }

  footer{ text-align:center; color:var(--muted); font-size:.85em; margin-top:36px; }

  @media (max-width:600px){
    main{ padding:32px 16px 24px; }
    h1{ font-size:24px; }
    li a{ padding:16px; }
  }
</style>
</head>
<body>
<main>
  <h1>欢迎回来</h1>
  <p class="sub">请选择你要访问的模块</p>

  <ul id="nav">

    <li><a href="钢琴调式1.html">钢琴调式1</a></li>
    <li><a href="钢琴调式2.html">钢琴调式2</a></li>
    <li><a href="钢琴调式3.html">钢琴调式3</a></li>
    <!-- AUTO:END -->
  </ul>

  <footer>&copy; 2026 我的本地工作站</footer>
</main>
</body>
</html>
