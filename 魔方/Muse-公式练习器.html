<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>公式练习器</title>
  <style>
    :root{
      color-scheme:light dark;
      --bg:#f4f6f8;--panel:#ffffff;--ink:#17202a;--muted:#64707d;--line:#dce1e6;
      --accent:#e94632;--accent-ink:#fff;--soft:#edf1f4;--good:#16794b;--warn:#a65d00;--err:#c62f1f;--prime:#d95d00;
      --shadow:0 18px 50px rgba(20,29,38,.12);
      --cube-size:clamp(196px,56vw,300px);
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#11161b;--panel:#1b2229;--ink:#f3f5f7;--muted:#a8b1ba;--line:#333c45;
      --accent:#ff6652;--accent-ink:#171717;--soft:#252e36;--good:#55c98d;--warn:#f1a843;--err:#ff7a6b;--prime:#ffab4d;
      --shadow:0 20px 55px rgba(0,0,0,.34);
    }}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%}
    [hidden]{display:none!important}
    body{font-family:"Aptos","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;overflow-x:hidden;min-height:100dvh}
    button,input{font:inherit} button{color:inherit}
    main{max-width:1120px;margin:auto;padding:clamp(14px,3vw,30px);padding-bottom:calc(20px + env(safe-area-inset-bottom))}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .state-title{margin:0;font-size:clamp(23px,3vw,32px);letter-spacing:-.03em}.state-title span{color:var(--accent)}
    .pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 11px;background:var(--soft);font-size:13px;font-weight:700;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.pill.live .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
    .layout{display:grid;grid-template-columns:1fr;gap:16px}
    .side{display:flex;flex-direction:column;gap:16px;min-width:0}
    .stage,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px}
    .stage{display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
    .stage-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px}
    .stage-head .pill{background:var(--soft)}
    .cube-zone{flex:1;display:grid;place-items:center;perspective:850px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;min-height:calc(var(--cube-size)*1.62 + 16px);padding:8px 0}
    .cube-zone:active{cursor:grabbing}
    .cube{position:relative;width:var(--cube-size);height:var(--cube-size);-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg);transition:transform .05s linear}
    .face{position:absolute;inset:0;padding:5px;background:#0b0d0f;border:1px solid #050607;-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .face-grid{width:100%;height:100%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;transform-origin:50% 50%}
    .sticker{position:relative;border-radius:8%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),inset 0 -3px 5px rgba(0,0,0,.08);transition:background .12s ease}.sticker.anim-hidden{visibility:hidden}
    .turn-layer{position:absolute;inset:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;pointer-events:none;will-change:transform}.anim-sticker{position:absolute;left:50%;top:50%;border-radius:8%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18),inset 0 -3px 5px rgba(0,0,0,.1);-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .anim-slab{position:absolute;left:50%;top:50%;width:0;height:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
    .anim-slab-face{position:absolute;left:0;top:0;background:#0b0d0f;border:1px solid #050607;border-radius:2px}
    .face-letter{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:1.55em;height:1.55em;border-radius:50%;background:rgba(10,12,14,.78);color:#fff;font-size:clamp(12px,2.5vw,18px);font-weight:900;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none;-webkit-backface-visibility:hidden;backface-visibility:hidden}
    .face-U{transform:rotateX(90deg) translateZ(calc(var(--cube-size)/2))}.face-D{transform:rotateX(-90deg) translateZ(calc(var(--cube-size)/2))}.face-F{transform:translateZ(calc(var(--cube-size)/2))}.face-B{transform:rotateY(180deg) translateZ(calc(var(--cube-size)/2))}.face-R{transform:rotateY(90deg) translateZ(calc(var(--cube-size)/2))}.face-L{transform:rotateY(-90deg) translateZ(calc(var(--cube-size)/2))}
    .c-W{background:#f5f5f2}.c-Y{background:#ffd500}.c-G{background:#11a864}.c-B{background:#1769d2}.c-R{background:#e43b31}.c-O{background:#ff7a1a}
    .stage-note{padding:0 16px 14px;text-align:center;color:var(--muted);font-size:13px}
    .card{padding:16px}.card h2{font-size:15px;margin:0 0 12px}
    .primary{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);padding:12px 16px;font-weight:800;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;min-height:44px}.primary:hover{filter:brightness(.96)}.primary:disabled{opacity:.48;cursor:not-allowed}
    .secondary{border:1px solid var(--line);border-radius:9px;background:var(--soft);padding:9px 12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-height:44px}.secondary:disabled{opacity:.42;cursor:not-allowed}
    .field-row{display:flex;gap:8px}
    .field-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:11px 12px;font-size:16px;font-family:"SFMono-Regular",Consolas,monospace}
    .field-row input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
    .err{color:var(--err);font-size:13px;font-weight:700;margin:9px 0 0}.err:empty{display:none}
    .hint{margin:9px 0 0;color:var(--muted);font-size:12px}
    .now{margin-top:13px;border-top:1px dashed var(--line);padding-top:12px}
    .now-line{font-size:14px;font-weight:700;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
    .mono{font-family:"SFMono-Regular",Consolas,monospace;font-weight:700;word-break:break-all}
    .move-token{display:inline-block;min-width:1.7em;padding:2px 5px;border-radius:5px;background:var(--soft);text-align:center;font-family:"SFMono-Regular",Consolas,monospace;font-size:15px;transition:background .15s,color .15s,transform .15s}
    .move-token.active{background:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
    .practice-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .practice-actions .secondary{flex:1;font-size:14px;padding:9px 6px;white-space:nowrap}
    .replay-bar{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
    .replay-bar .secondary{padding:8px 10px}
    .play-status{width:100%;font-family:"SFMono-Regular",Consolas,monospace;color:var(--ink);font-weight:800;font-size:13px;margin-top:2px}
    .success{margin-top:13px;border:1px solid color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 13%,transparent);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .success strong{color:var(--good);font-size:15px}
    .success .primary{margin-left:auto;background:var(--good);color:#fff}
    .pad{display:grid;grid-template-columns:repeat(6,1fr);column-gap:5px;row-gap:9px;margin-top:8px}
    .pad button{min-width:0;min-height:40px;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:5px 2px;font-family:"SFMono-Regular",Consolas,monospace;font-weight:800;font-size:15px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .07s ease,background .15s ease,border-color .15s ease}
    .pad button:hover{border-color:var(--accent)}
    .pad button:active{transform:scale(.92)}
    .pad button:disabled{opacity:.45;cursor:not-allowed}
    .pad button .prime{color:var(--prime);font-size:1.35em;font-weight:900;margin-left:1px}
    .pad button.g-wide{background:color-mix(in srgb,#f59e0b 8%,var(--soft))}
    .pad button.g-mid{background:color-mix(in srgb,#3b82f6 9%,var(--soft))}
    .pad button.hint-key{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);animation:hintPulse 1.15s ease-in-out infinite}
    .pad button.flash-ok{background:var(--good)!important;color:#fff!important;border-color:var(--good)}
    @keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--accent) 0%,transparent)}}
    .pad-utils{display:flex;gap:6px;margin-top:9px}
    .pad-utils button{min-height:40px;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:5px 2px;font-weight:800;font-size:13px;cursor:pointer;flex:1;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .07s ease}
    .pad-utils button:active{transform:scale(.96)}
    .pad-utils button:disabled{opacity:.45;cursor:not-allowed}
    .tool-row{display:flex;gap:8px;margin-top:10px}
    .tool-row .secondary{flex:1;min-height:48px;font-size:15px}
    .duo-row{display:flex;gap:8px;margin-top:10px}
    .duo-row .primary,.duo-row .secondary{flex:1;min-height:48px}
    .start-btn{display:block;width:100%;margin-top:14px;padding:16px;font-size:18px;border-radius:12px}
    .stat-row{display:flex;align-items:center;gap:9px;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;flex-wrap:wrap}
    .stat-row .secondary{min-height:42px}
    .demo-progress{flex:1;display:flex;align-items:center;gap:10px;min-height:44px}
    .demo-track{flex:1;height:5px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
    .demo-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s ease}
    .demo-count{font-family:"SFMono-Regular",Consolas,monospace;font-weight:800;font-size:14px;white-space:nowrap}
    .paste-fallback{position:fixed;inset:0;z-index:80;background:rgba(8,12,16,.42);display:grid;place-items:center;padding:18px}
    .paste-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
    .paste-title{margin:0 0 10px;font-weight:800;font-size:15px}
    .paste-card textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px 12px;font-size:16px;font-family:"SFMono-Regular",Consolas,monospace;resize:vertical}
    .paste-card textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
    .paste-actions{display:flex;gap:8px;margin-top:12px}
    .paste-actions .secondary,.paste-actions .primary{flex:1}
    .card-head-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
    .card-head-row h2{margin:0}
    .goal-count{color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
    .htm-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
    .htm-num{font-size:42px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
    .htm-unit{font-size:14px;font-weight:700}
    .field-label{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
    .history-input{cursor:pointer}
    .history-text{margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;white-space:nowrap;overflow-x:auto;min-height:47px}
    .history-input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
    .copy-btn{flex:none}
    .head-right{display:inline-flex;align-items:center;gap:8px}
    .hint-toggle{border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;min-height:32px;white-space:nowrap}
    .hint-toggle[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
    .move-token.hint-next{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 2px var(--accent);color:var(--accent)}
    .lib{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
    .lib-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:11px 12px;font-weight:800;cursor:pointer;min-height:44px}
    .lib-arrow{color:var(--muted);transition:transform .2s}
    .lib-toggle[aria-expanded="true"] .lib-arrow{transform:rotate(180deg)}
    .lib-group{margin:12px 0 7px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em}
    .chip-wrap{display:flex;flex-wrap:wrap;gap:7px}
    .chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:7px 10px;cursor:pointer;text-align:left}
    .chip:hover{border-color:var(--accent)}
    .chip-name{font-size:12px;font-weight:800;color:var(--accent)}
    .chip-formula{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;font-weight:700}
    /* ---- ONE keyboard component for both modes: a small floating panel
       pinned above the bottom edge with side margins, rounded corners and
       a shadow. Non-modal — no overlay, no mask — so the cube above stays
       visible and draggable while it is out. The panel itself is frosted
       glass (translucent + backdrop blur); the keys on it stay solid and
       fully opaque. Bottom offset uses the iOS safe area. ---- */
    .kbd-panel{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;background:color-mix(in srgb,var(--panel) 76%,transparent);-webkit-backdrop-filter:blur(11px) saturate(1.5);backdrop-filter:blur(11px) saturate(1.5);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 46px rgba(10,16,22,.32);padding:10px;transform:translateY(calc(100% + 26px));visibility:hidden;transition:transform .3s cubic-bezier(.22,.72,.28,1),visibility 0s linear .3s;overscroll-behavior:contain;touch-action:manipulation;user-select:none;-webkit-user-select:none}
    .kbd-panel.open{transform:translateY(0);visibility:visible;transition:transform .3s cubic-bezier(.22,.72,.28,1)}
    .kbd-head{display:flex;align-items:center;justify-content:flex-end;gap:10px}
    .kbd-msg{font-size:12px;font-weight:700;color:var(--err);text-align:right}
    .kbd-msg.ok{color:var(--good)}
    .kbd-msg:empty{display:none}
    .kbd-actions{display:flex;gap:6px;margin-top:6px}
    .kbd-actions .secondary,.kbd-actions .primary{flex:1;min-height:40px;padding:5px 8px;font-size:14px}
    /* ---- Shared frame: both modes use the same topline, the same stage and
       one fixed --cube-size, so switching modes never moves or resizes the
       cube. Only the side panel swaps: input panel <-> practice panel.
       The practice panel is a stack in that column (below the cube on
       phones, beside it on desktop) holding, top to bottom: a 步数 card
       (big move count + read-only history field + 复制 button), the
       action row (演示答案 / ↺ 重练 / ← 返回, three equal columns — the
       first two swapped for a thin progress bar + "i/n" while a demo
       plays), then the target-formula card. The keys live in the one floating keyboard
       panel (.kbd-panel): spell mode while typing a formula, execute mode
       while practicing — opened by tapping the formula input or the
       history field, open by default on entering practice, and closed by
       完成, by starting a demo, by solving, or by running a scramble. ---- */
    @media(max-height:620px){.pad button{min-height:34px}.pad{row-gap:6px}.pad-utils button{min-height:34px}.kbd-actions .secondary,.kbd-actions .primary{min-height:34px}}
    body.mode-practice #phasePill{display:none}
    body.mode-practice .stage-note{display:none}
    .practice-stack{display:flex;flex-direction:column;gap:16px}
    .practice-stack .practice-actions{margin-top:0}
    @media(min-width:640px){
      .kbd-panel{left:50%;right:auto;width:512px;max-width:calc(100vw - 20px);transform:translate(-50%,calc(100% + 26px))}
      .kbd-panel.open{transform:translate(-50%,0)}
    }
    @media(min-width:900px){
      .layout{grid-template-columns:minmax(400px,1.12fr) minmax(330px,.88fr);gap:20px}
      .stage{position:sticky;top:18px;align-self:start;min-height:520px}
    }
    @media(max-width:420px){
      .pad{column-gap:4px;row-gap:7px}.pad button{font-size:13px;padding:5px 1px}
      .card{padding:14px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}.pad button.hint-key{animation:none}}
  </style>
</head>
<body class="mode-input">
<main>
  <div class="topline">
    <h1 class="state-title">公式<span>练习器</span></h1>
    <div class="pill" id="phasePill"><span class="dot"></span><span id="pillText">待机</span></div>
  </div>

  <div class="layout">
    <section class="stage">
      <div class="stage-head">
        <span style="font-size:13px;color:var(--muted);font-weight:700">黄顶 · 红前（标准配色）</span>
        <button class="secondary" id="resetViewBtn" style="padding:6px 10px">重置视角</button>
      </div>
      <div class="cube-zone" id="cubeZone" aria-label="可拖动旋转视角的三维魔方">
        <div class="cube" id="cube"></div>
      </div>
      <div class="stage-note" id="stageNote">拖动魔方旋转视角</div>
    </section>

    <div class="side">
      <section class="card" id="inputPanel">
        <h2>输入公式</h2>
        <div class="field-row">
          <input id="formulaInput" type="text" inputmode="none" placeholder="如 R U R' U' (R U R' U')x2" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="公式">
        </div>
        <div class="tool-row">
          <button class="secondary" id="randomBtn">🎲 随机打乱</button>
        </div>
        <div class="duo-row">
          <button class="primary" id="forwardBtn">正向打乱</button>
          <button class="secondary" id="reverseBtn">反向打乱</button>
        </div>
        <p class="err" id="formulaErr" role="alert"></p>
        <p class="hint">空格分隔，每步是 U D L R F B（小写是宽转，另支持 M E S 中层转），可带 ' 或 2；括号分组可重复，如 (R U R' U')x3。正向打乱照公式拧；反向打乱按逆公式（倒序取逆）拧，输入还原公式练还原就用它。打乱前会先把魔方复原。</p>
        <div class="now" id="scrambleNow" hidden>
          <div class="now-line">当前打乱：<span class="mono" id="scrambleNowText"></span></div>
        </div>
        <div class="lib">
          <button class="lib-toggle" id="libToggle" type="button" aria-expanded="false" aria-controls="libBody"><span>📚 公式库</span><span class="lib-arrow">▾</span></button>
          <div class="lib-body" id="libBody" hidden>
            <p class="lib-group">OLL</p>
            <div class="chip-wrap" id="ollChips"></div>
            <p class="lib-group">PLL</p>
            <div class="chip-wrap" id="pllChips"></div>
          </div>
        </div>
        <button class="primary start-btn" id="startBtn" hidden>开始练习 →</button>
      </section>

      <div class="practice-stack" id="practicePanel" hidden>
        <section class="card">
          <div class="htm-head">
            <span class="htm-num" id="moveCount">0</span>
            <span class="htm-unit">步数</span>
          </div>
          <div class="field-row">
            <input id="historyInput" class="history-input" type="text" inputmode="none" readonly placeholder="点这里打开转动按钮" aria-label="你的步骤，点按打开转动按钮面板">
            <button class="secondary copy-btn" id="copyBtn" type="button">复制</button>
          </div>
          <div class="success" id="success" hidden>
            <strong id="successText">还原成功！</strong>
            <button class="primary" id="successAgainBtn">↺ 重练</button>
          </div>
        </section>
        <div class="practice-actions">
          <button class="secondary" id="demoBtn">演示答案</button>
          <button class="secondary" id="retryBtn">↺ 重练</button>
          <button class="secondary" id="backBtn">← 返回</button>
          <div class="demo-progress" id="demoProgress" hidden>
            <div class="demo-track"><div class="demo-fill" id="demoFill"></div></div>
            <span class="demo-count" id="demoCount">0/0</span>
          </div>
        </div>
        <section class="card">
          <div class="card-head-row">
            <h2>目标公式</h2>
            <span class="head-right">
              <button class="hint-toggle" id="hintToggle" type="button" aria-pressed="false" hidden>💡 提示</button>
              <span class="goal-count" id="solutionCount"></span>
            </span>
          </div>
          <div class="now-line"><span id="practiceTokens"></span></div>
          <div class="replay-bar" id="replayBar" hidden>
            <button class="secondary" id="prevBtn">上一步</button>
            <button class="secondary" id="nextBtn">下一步</button>
            <button class="secondary" id="autoBtn">自动演示</button>
            <button class="secondary" id="exitReplayBtn">退出演示</button>
            <span class="play-status" id="playStatus"></span>
          </div>
        </section>
      </div>
    </div>
  </div>
</main>
<section class="kbd-panel" id="kbdPanel" aria-label="公式键盘" aria-hidden="true">

</div>
<script>
(function(){
  'use strict';
  var FACE={U:{n:[0,1,0],axis:1,sign:1},D:{n:[0,-1,0],axis:1,sign:-1},F:{n:[0,0,1],axis:2,sign:1},B:{n:[0,0,-1],axis:2,sign:-1},R:{n:[1,0,0],axis:0,sign:1},L:{n:[-1,0,0],axis:0,sign:-1}};
  var COLORS={U:'Y',D:'W',F:'R',B:'O',R:'G',L:'B'};
  var els={cube:q('cube'),zone:q('cubeZone'),kbdPad:q('kbdPad'),count:q('moveCount'),retry:q('retryBtn'),pill:q('phasePill'),pillText:q('pillText'),
    historyInput:q('historyInput'),copyBtn:q('copyBtn'),solutionCount:q('solutionCount'),hintToggle:q('hintToggle'),
    libToggle:q('libToggle'),libBody:q('libBody'),ollChips:q('ollChips'),pllChips:q('pllChips'),
    inputPanel:q('inputPanel'),practicePanel:q('practicePanel'),stageNote:q('stageNote'),
    formulaInput:q('formulaInput'),formulaErr:q('formulaErr'),
    randomBtn:q('randomBtn'),forwardBtn:q('forwardBtn'),reverseBtn:q('reverseBtn'),startBtn:q('startBtn'),
    scrambleNow:q('scrambleNow'),scrambleNowText:q('scrambleNowText'),
    tokens:q('practiceTokens'),
    demoBtn:q('demoBtn'),demoProgress:q('demoProgress'),demoFill:q('demoFill'),demoCount:q('demoCount'),backBtn:q('backBtn'),replayBar:q('replayBar'),prev:q('prevBtn'),next:q('nextBtn'),auto:q('autoBtn'),exit:q('exitReplayBtn'),play:q('playStatus'),
    success:q('success'),successText:q('successText'),successAgainBtn:q('successAgainBtn'),
    kbdPanel:q('kbdPanel'),kbdMsg:q('kbdMsg'),kbdPaste:q('kbdPaste'),kbdDone:q('kbdDone'),
    pasteFallback:q('pasteFallback'),pasteText:q('pasteText'),pasteFbErr:q('pasteFbErr'),pasteCancel:q('pasteCancel'),pasteConfirm:q('pasteConfirm')};
  function q(id){return document.getElementById(id)}
  var stickers=[], stickerEls={}, faceGrids={}, phase='idle', moves=[], inputQueue=[], turnAnimating=false, animationToken=0;
  var viewX=-24,viewY=-38,drag=null;
  var mode='input';
  var currentPractice=null, playbackStates=[], playbackMoves=[], playbackIndex=0, autoId=null;
  var hintOn=false;
  var PILL={idle:'待机',running:'打乱中',ready:'已打乱',practice:'练习中',done:'已完成',replay:'演示中'};

  function solved(){
    stickers=[];
    Object.keys(FACE).forEach(function(f){
      var n=FACE[f].n;
      for(var a=-1;a<=1;a++)for(var b=-1;b<=1;b++){
        var p;
        if(f==='F'||f==='B')p=[a,b,n[2]];
        else if(f==='U'||f==='D')p=[a,n[1],b];
        else p=[n[0],b,a];
        stickers.push({p:p,n:n.slice(),c:COLORS[f]});
      }
    });
  }
  function buildCube(){
    ['U','D','F','B','R','L'].forEach(function(f){
      var face=document.createElement('div');face.className='face face-'+f;face.dataset.face=f;
      var grid=document.createElement('div');grid.className='face-grid';faceGrids[f]=grid;
      for(var i=0;i<9;i++){var s=document.createElement('div');s.className='sticker';s.dataset.i=i;if(i===4){var label=document.createElement('span');label.className='face-letter';label.textContent=f;label.setAttribute('aria-hidden','true');s.appendChild(label)}grid.appendChild(s);stickerEls[f+'-'+i]=s}
      face.appendChild(grid);els.cube.appendChild(face);
    }); render();
  }
  function faceFromNormal(n){if(n[1]===1)return'U';if(n[1]===-1)return'D';if(n[2]===1)return'F';if(n[2]===-1)return'B';if(n[0]===1)return'R';return'L'}
  function cellIndex(f,p){var row,col;
    if(f==='F'){row=1-p[1];col=p[0]+1}
    if(f==='B'){row=1-p[1];col=1-p[0]}
    if(f==='U'){row=p[2]+1;col=p[0]+1}
    if(f==='D'){row=1-p[2];col=p[0]+1}
    if(f==='R'){row=1-p[1];col=1-p[2]}
    if(f==='L'){row=1-p[1];col=p[2]+1}
    return row*3+col;
  }
  function render(){
    Object.keys(stickerEls).forEach(function(k){stickerEls[k].className='sticker'});
    stickers.forEach(function(s){var f=faceFromNormal(s.n),i=cellIndex(f,s.p);stickerEls[f+'-'+i].className='sticker c-'+s.c});
  }
  function rot(v,axis,qtr){var x=v[0],y=v[1],z=v[2];if(qtr<0){qtr=3}qtr%=4;while(qtr--){if(axis===0){var ny=-z,nz=y;y=ny;z=nz}else if(axis===1){var nx=z,nz2=-x;x=nx;z=nz2}else{var nx2=-y,ny2=x;x=nx2;y=ny2}}return[x,y,z]}
  function parseMove(m){return{f:m[0],times:m.indexOf('2')>0?2:1,prime:m.indexOf("'")>0}}
  // ---- Move spec: one descriptor for every turn kind the parser accepts.
  //      lo..hi is the range of layer coordinates (along axis) that turn:
  //      a face turn is just its outer layer, a wide turn (lowercase) adds
  //      the middle layer, and M/E/S turn only the middle layer, rotating
  //      in the direction of L / D / F respectively. qtr is the quarter-turn
  //      rotation used by rot() for one non-prime quarter. ----
  function moveSpec(m){
    var z=parseMove(m),base=z.f,up=base.toUpperCase(),fd=FACE[up],spec;
    if(fd&&base===up){spec={axis:fd.axis,lo:fd.sign,hi:fd.sign,qtr:-fd.sign*(z.prime?-1:1)}}
    else if(fd){spec={axis:fd.axis,lo:Math.min(0,fd.sign),hi:Math.max(0,fd.sign),qtr:-fd.sign*(z.prime?-1:1)}}
    else{var f2=FACE[{M:'L',E:'D',S:'F'}[base]];spec={axis:f2.axis,lo:0,hi:0,qtr:-f2.sign*(z.prime?-1:1)}}
    spec.times=z.times;
    return spec;
  }
  function applyMove(m,record){var spec=moveSpec(m);for(var t=0;t<spec.times;t++)stickers.forEach(function(s){var c=s.p[spec.axis];if(c<spec.lo||c>spec.hi)return;s.p=rot(s.p,spec.axis,spec.qtr);s.n=rot(s.n,spec.axis,spec.qtr)});if(record)moves.push(m);updateMoveCount();render()}
  function copyState(){return stickers.map(function(s){return{p:s.p.slice(),n:s.n.slice(),c:s.c}})}
  function restore(state){stickers=state.map(function(s){return{p:s.p.slice(),n:s.n.slice(),c:s.c}});render()}
  function inverse(m){if(m.indexOf('2')>0)return m;return m.indexOf("'")>0?m[0]:m+"'"}
  function inverseSeq(list){return list.slice().reverse().map(inverse)}
  function cubeSolved(){var seen={};for(var i=0;i<stickers.length;i++){var s=stickers[i],k=s.n.join();if(seen[k]===undefined)seen[k]=s.c;else if(seen[k]!==s.c)return false}return true}
  function updateMoveCount(){
    els.count.textContent=moves.length;
    els.historyInput.value=moves.join(' ');
    els.historyInput.scrollLeft=els.historyInput.scrollWidth;
    updateHint();
  }
  // ---- Solid backing slab for the turning slice: a body-colored box that
  //      exactly fills the turning layers and rotates with the turn layer,
  //      so the gaps between clone stickers (and their hidden backsides)
  //      never show through to the black behind the cube mid-animation. ----
  function makeSlab(spec,size,step){
    var thick=step*(spec.hi-spec.lo+1),span=size-2,dims=[span,span,span];dims[spec.axis]=thick;
    var off=[0,0,0];off[spec.axis]=(spec.lo+spec.hi)/2*step;
    var slab=document.createElement('div');slab.className='anim-slab';
    slab.style.transform='translate3d('+off[0]+'px,'+(-off[1])+'px,'+off[2]+'px)';
    function face(fw,fh,tr){var el=document.createElement('div');el.className='anim-slab-face';el.style.width=fw+'px';el.style.height=fh+'px';el.style.marginLeft=(-fw/2)+'px';el.style.marginTop=(-fh/2)+'px';el.style.transform=tr;slab.appendChild(el)}
    face(dims[0],dims[1],'translateZ('+(dims[2]/2)+'px)');
    face(dims[0],dims[1],'rotateY(180deg) translateZ('+(dims[2]/2)+'px)');
    face(dims[2],dims[1],'rotateY(90deg) translateZ('+(dims[0]/2)+'px)');
    face(dims[2],dims[1],'rotateY(-90deg) translateZ('+(dims[0]/2)+'px)');
    face(dims[0],dims[2],'rotateX(90deg) translateZ('+(dims[1]/2)+'px)');
    face(dims[0],dims[2],'rotateX(-90deg) translateZ('+(dims[1]/2)+'px)');
    return slab;
  }
  function makeTurnLayer(spec){
    var size=els.cube.getBoundingClientRect().width,cell=(size-16)/3,step=(size-7)/3,half=size/2+.7,layer=document.createElement('div'),originals=[];layer.className='turn-layer';
    layer.appendChild(makeSlab(spec,size,step));
    stickers.forEach(function(s){var coord=s.p[spec.axis];if(coord<spec.lo||coord>spec.hi)return;var f=faceFromNormal(s.n),i=cellIndex(f,s.p),original=stickerEls[f+'-'+i],clone=document.createElement('div');original.classList.add('anim-hidden');originals.push(original);clone.className='anim-sticker c-'+s.c;clone.style.width=cell+'px';clone.style.height=cell+'px';clone.style.marginLeft=(-cell/2)+'px';clone.style.marginTop=(-cell/2)+'px';
      var x=s.p[0]*step,y=-s.p[1]*step,zp=s.p[2]*step,faceTransform='';if(f==='U')faceTransform=' rotateX(90deg)';if(f==='D')faceTransform=' rotateX(-90deg)';if(f==='R')faceTransform=' rotateY(90deg)';if(f==='L')faceTransform=' rotateY(-90deg)';if(f==='B')faceTransform=' rotateY(180deg)';
      if(s.n[0]!==0)x=s.n[0]*half;if(s.n[1]!==0)y=-s.n[1]*half;if(s.n[2]!==0)zp=s.n[2]*half;clone.style.transform='translate3d('+x+'px,'+y+'px,'+zp+'px)'+faceTransform;
      if(s.p.join()===s.n.join()){var label=document.createElement('span');label.className='face-letter';label.textContent=f;clone.appendChild(label)}layer.appendChild(clone)
    });els.cube.appendChild(layer);return{node:layer,originals:originals}
  }
  function animateMove(m,record,done,dur){
    if(turnAnimating)return;turnAnimating=true;var token=++animationToken,spec=moveSpec(m),reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduce?0:(dur||200),visual=null;
    if(duration){visual=makeTurnLayer(spec);var qtr=spec.qtr*spec.times,angles=[-qtr*90,qtr*90,-qtr*90],axis=spec.axis===0?'X':spec.axis===1?'Y':'Z';visual.node.offsetWidth;visual.node.style.transition='transform '+duration+'ms cubic-bezier(.22,.72,.28,1)';visual.node.style.transform='rotate'+axis+'('+angles[spec.axis]+'deg)'}
    setTimeout(function(){if(token!==animationToken){if(visual){visual.originals.forEach(function(el){el.classList.remove('anim-hidden')});visual.node.remove()}return}applyMove(m,record);if(visual){visual.originals.forEach(function(el){el.classList.remove('anim-hidden')});visual.node.remove()}turnAnimating=false;if(done)done()},duration);
  }
  function cancelAnimation(){animationToken++;turnAnimating=false;Array.prototype.forEach.call(els.cube.querySelectorAll('.turn-layer'),function(layer){layer.remove()});Array.prototype.forEach.call(els.cube.querySelectorAll('.anim-hidden'),function(el){el.classList.remove('anim-hidden')})}

  // ---- Formula parser: space-separated moves, ( ... ) groups, xN / N repeats ----
  function normalizeMoveToken(w){
    var f=w.charAt(0),up=f.toUpperCase();
    if(('UDLRFB'.indexOf(up)<0&&'MES'.indexOf(f)<0)||w.length>3)return null;
    var rest=w.slice(1).replace(/′/g,"'");
    if(rest==='')return f;
    if(rest==="'")return f+"'";
    if(rest==='2'||rest==="2'")return f+'2';
    return null;
  }
  function parseFormula(str){
    var pos=0,len=str.length;
    function skipWs(){while(pos<len&&/\s/.test(str.charAt(pos)))pos++}
    function readRepeat(){
      var save=pos;skipWs();var ch=str.charAt(pos);
      if(ch==='x'||ch==='X'||ch==='×'){
        pos++;var s=pos;while(pos<len&&/[0-9]/.test(str.charAt(pos)))pos++;
        if(s===pos)throw new Error("x 后面要跟重复次数，如 x3");
        var n=parseInt(str.slice(s,pos),10);if(n<1||n>99)throw new Error('重复次数不合理：'+n);return n;
      }
      if(/[0-9]/.test(ch)){var s2=pos;while(pos<len&&/[0-9]/.test(str.charAt(pos)))pos++;var n2=parseInt(str.slice(s2,pos),10);if(n2<1||n2>99)throw new Error('重复次数不合理：'+n2);return n2}
      pos=save;return 1;
    }
    function parseSeq(inParen){
      var out=[];
      while(true){
        skipWs();
        if(pos>=len){if(inParen)throw new Error('括号没有闭合');return out}
        var ch=str.charAt(pos);
        if(ch===')'){if(!inParen)throw new Error('多了一个 )');pos++;return out}
        if(ch==='('){pos++;var inner=parseSeq(true);var rep=readRepeat();for(var i=0;i<rep;i++){out=out.concat(inner);if(out.length>300)throw new Error('展开后超过 300 步，公式太长')}continue}
        var start=pos;while(pos<len&&!/[\s()]/.test(str.charAt(pos)))pos++;
        var w=str.slice(start,pos);
        if(!w){pos++;continue}
        var mv=normalizeMoveToken(w);
        if(!mv)throw new Error("无法识别的步：「"+w+"」（支持 U D L R F B、小写宽转、M E S，可带 ' 或 2）");
        out.push(mv);
        if(out.length>300)throw new Error('展开后超过 300 步，公式太长');
      }
    }
    var out=parseSeq(false);
    if(!out.length)throw new Error('请先输入公式');
    return out;
  }
  function tryParse(input,errEl){
    try{var mv=parseFormula(input.value);errEl.textContent='';return mv}
    catch(e){errEl.textContent=e.message;return null}
  }

  // ---- UI state ----
  function disableTurns(disabled){if(kbdMode!=='exec')disabled=false;Array.prototype.forEach.call(els.kbdPad.querySelectorAll('button'),function(b){b.disabled=disabled})}
  function clearActiveTokens(){Array.prototype.forEach.call(els.tokens.querySelectorAll('.move-token'),function(t){t.classList.remove('active')})}
  function setMode(m){
    mode=m;
    document.body.classList.toggle('mode-input',m==='input');
    document.body.classList.toggle('mode-practice',m==='practice');
    els.inputPanel.hidden=m!=='input';
    els.practicePanel.hidden=m!=='practice';
  }
  function syncUI(){
    var busy=phase==='running'||phase==='replay';
    disableTurns(busy||phase==='done'||mode!=='practice');
    els.forwardBtn.disabled=busy;els.reverseBtn.disabled=busy;els.randomBtn.disabled=busy;
    els.startBtn.hidden=!(mode==='input'&&phase==='ready');
    var canAct=!!(currentPractice&&currentPractice.startState&&(phase==='practice'||phase==='done'));
    els.demoBtn.disabled=!canAct;
    els.retry.disabled=!canAct;
    var inReplay=phase==='replay';
    els.demoBtn.hidden=inReplay;els.retry.hidden=inReplay;els.demoProgress.hidden=!inReplay;
    els.backBtn.disabled=busy;
    els.pillText.textContent=PILL[phase];
    els.pill.classList.toggle('live',phase==='running'||phase==='practice'||phase==='replay'||phase==='ready');
    updateMoveCount();
  }
  function runScript(list,after){
    var i=0;
    (function step(){if(i>=list.length){if(after)after();return}animateMove(list[i++],false,step,110)})();
  }
  function beginScrambleRun(list,after){
    stopAuto();cancelAnimation();inputQueue=[];moves=[];
    els.success.hidden=true;els.replayBar.hidden=true;clearActiveTokens();els.play.textContent='';
    solved();render();phase='running';syncUI();
    runScript(list,after);
  }

  // ---- User turns ----
  function userTurn(m){if(phase!=='practice')return;inputQueue.push({kind:'move',move:m});updateMoveCount();drainInput()}
  function undoTurn(){if(phase!=='practice')return;inputQueue.push({kind:'undo'});drainInput()}
  function drainInput(){
    if(turnAnimating||!inputQueue.length)return;
    if(phase!=='practice'){inputQueue=[];updateMoveCount();return}
    var action=inputQueue.shift();
    if(action.kind==='undo'){
      if(!moves.length){updateMoveCount();drainInput();return}
      var last=moves[moves.length-1];
      animateMove(inverse(last),false,function(){moves.pop();updateMoveCount();checkSolved();drainInput()});
      return;
    }
    animateMove(action.move,true,function(){updateMoveCount();checkSolved();drainInput()});
  }
  function checkSolved(){if(phase==='practice'&&moves.length&&cubeSolved()){inputQueue=[];finishPractice()}}
  function finishPractice(){
    closeKbd();
    phase='done';
    els.successText.textContent='还原成功！共 '+moves.length+' 步（目标公式 '+currentPractice.solution.length+' 步）';
    els.success.hidden=false;syncUI();
  }

  // ---- THE keyboard: one component, one builder, two modes. Spell mode
  //      (input panel) types text into the formula field; execute mode
  //      (practice panel) turns the cube. The layout never changes: a flat
  //      6-column grid — plain and prime rows for U R F D L B (g-outer),
  //      plain and prime rows for the lowercase wide turns (g-wide), then
  //      M M' E E' S S' (g-mid), each group on its own very faint tint —
  //      above a utility row (退格 / 清空, two equal halves). The prime mark is its
  //      own span so it can render orange, bold and larger than the letter
  //      without moving the layout. The panel's own 粘贴 / 完成 actions row
  //      sits below the pad: in spell mode 粘贴 fills the text field, in
  //      execute mode it parses the clipboard formula and runs it. ----
  function buildMovePad(host,handlers){
    var rows=[
      {g:'g-outer',moves:['U','R','F','D','L','B']},
      {g:'g-outer',moves:["U'","R'","F'","D'","L'","B'"]},
      {g:'g-wide',moves:['u','r','f','d','l','b']},
      {g:'g-wide',moves:["u'","r'","f'","d'","l'","b'"]},
      {g:'g-mid',moves:['M',"M'",'E',"E'",'S',"S'"]}
    ];
    var page=document.createElement('div');page.className='pad';
    rows.forEach(function(row){
      row.moves.forEach(function(m){
        var b=document.createElement('button');b.type='button';b.className='key '+row.g;b.setAttribute('data-move',m);
        if(m.charAt(m.length-1)==="'"){
          b.appendChild(document.createTextNode(m.slice(0,-1)));
          var ps=document.createElement('span');ps.className='prime';ps.textContent="'";b.appendChild(ps);
        }else b.textContent=m;
        b.addEventListener('click',function(){handlers.move(m,b)});
        page.appendChild(b);
      });
    });
    host.appendChild(page);
    var utils=document.createElement('div');utils.className='pad-utils';
    handlers.utils.forEach(function(u,i){
      var b=document.createElement('button');b.type='button';b.className='util';b.textContent=u.label;
      b.addEventListener('click',u.action);
      utils.appendChild(b);
    });
    host.appendChild(utils);
  }
  // ---- The floating keyboard panel: ONE component reused by both modes.
  //      kbdMode is 'spell' on the input panel (keys type formula text)
  //      and 'exec' on the practice panel (keys turn the cube); the pad,
  //      the utility row and the 粘贴 / 完成 row are literally the same
  //      DOM in both. The panel floats above the page bottom — non-modal,
  //      no mask — purely as an overlay: opening or closing it never changes
  //      the page layout, adds no bottom padding and triggers no scrolling
  //      of any kind. It closes on 完成, on starting
  //      a demo, on solving, and on running any scramble. During a demo it
  //      stays shut and its keys are disabled (see disableTurns/syncUI),
  //      so a stray tap can never disturb the playback. ----
  var kbdOpen=false,kbdMode='spell';
  function setKbdMsg(text,ok){
    els.kbdMsg.textContent=text;
    els.kbdMsg.classList.toggle('ok',!!ok);
  }
  function openKbd(which){
    if(which==='exec'&&phase==='replay')return;
    kbdMode=which;
    setKbdMsg('');
    if(kbdOpen)return;
    kbdOpen=true;
    els.kbdPanel.classList.add('open');
    els.kbdPanel.setAttribute('aria-hidden','false');
    syncUI();
  }
  function closeKbd(){
    if(!kbdOpen)return;
    kbdOpen=false;
    els.kbdPanel.classList.remove('open');
    els.kbdPanel.setAttribute('aria-hidden','true');
    setKbdMsg('');
    if(kbdMode==='spell'&&document.activeElement===els.formulaInput)els.formulaInput.blur();
  }
  buildMovePad(els.kbdPad,{
    move:function(m,btn){
      if(kbdMode==='spell'){
        var v=els.formulaInput.value.replace(/\s+$/,'');
        els.formulaInput.value=v?v+' '+m:m;
        els.formulaErr.textContent='';
      }else{
        setKbdMsg('');
        var exp=expectedNextMove();
        if(exp&&exp===m&&btn){btn.classList.add('flash-ok');setTimeout(function(){btn.classList.remove('flash-ok')},380)}
        userTurn(m);
      }
    },
    utils:[
      {label:'⌫ 退格',action:function(){
        if(kbdMode==='spell'){
          var parts=els.formulaInput.value.replace(/\s+$/,'').split(/\s+/).filter(Boolean);
          parts.pop();
          els.formulaInput.value=parts.join(' ');
          els.formulaErr.textContent='';
        }else undoTurn();
      }},
      {label:'清空',action:function(){
        if(kbdMode==='spell'){els.formulaInput.value='';els.formulaErr.textContent=''}
        else clearPracticeMoves();
      }}
    ]
  });

  // ---- Practice pad extras, mirroring the input pad's buttons ----
  // ---- Manual paste fallback: when the Clipboard API is missing or the
  //      read is denied, a small text box lets the user paste by hand.
  //      确认 hands the text to the pending apply callback; it returns
  //      false (with an error shown in the box) to keep the box open. ----
  var pasteApply=null;
  function openPasteFallback(apply){
    pasteApply=apply;
    els.pasteText.value='';els.pasteFbErr.textContent='';
    els.pasteFallback.hidden=false;
    setTimeout(function(){try{els.pasteText.focus()}catch(e){}},40);
  }
  function closePasteFallback(){els.pasteFallback.hidden=true;pasteApply=null}
  // 清空: undo every recorded turn at once — drop the input queue, cancel
  // any in-flight turn, restore the post-scramble start state, zero the
  // count and history. No need to backspace through the whole history.
  function clearPracticeMoves(){
    if(phase!=='practice'||!currentPractice||!currentPractice.startState)return;
    stopAuto();cancelAnimation();inputQueue=[];moves=[];
    restore(currentPractice.startState);
    setKbdMsg('');
    updateMoveCount();
  }
  // 粘贴: read the clipboard, parse it as a formula, and execute the moves
  // on the cube (animated, recorded into the count and history, exactly as
  // if tapped key by key). Returns an error string, or '' on success. An
  // unparseable clipboard shows an error instead of turning anything.
  function applyPastedFormula(text){
    var list;
    try{list=parseFormula(text)}catch(e){return '公式有误：'+e.message}
    setKbdMsg('已粘贴 '+list.length+' 步',true);
    list.forEach(function(m){userTurn(m)});
    return '';
  }
  function pasteAndExecute(){
    if(phase!=='practice')return;
    function fallback(){
      openPasteFallback(function(text){
        var err=applyPastedFormula(text);
        if(err){els.pasteFbErr.textContent=err;return false}
        return true;
      });
    }
    if(!navigator.clipboard||!navigator.clipboard.readText){fallback();return}
    navigator.clipboard.readText().then(function(text){
      if(!text||!text.trim()){setKbdMsg('剪贴板是空的');return}
      var err=applyPastedFormula(text);
      if(err)setKbdMsg(err);
    }).catch(fallback);
  }

  // ---- Copy history: one tap on the 复制 button in the 步数 card copies the
  //      recorded moves to the clipboard; the button flashes the result. ----
  function copyHistory(){
    var text=moves.join(' '),btn=els.copyBtn;
    function flash(msg){btn.textContent=msg;setTimeout(function(){btn.textContent='复制'},1400)}
    if(!text){flash('暂无步骤');return}
    function fallback(){
      var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');flash('已复制')}catch(e){flash('复制失败')}
      ta.remove();
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){flash('已复制')},fallback)}
    else fallback();
  }

  // ---- Next-step hint (reverse scrambles only, where the typed formula is
  //      the known answer): highlight the answer's next move — the first step
  //      the user's recorded moves have not yet matched in a row — BOTH on
  //      the formula card's token and on the keyboard key itself (a strong
  //      pulsing key that stays readable on the frosted-glass panel).
  //      Recomputed after every turn and undo; a wrong move never nags, it
  //      just leaves the highlight on the step that should come next. ----
  function updateHint(){
    var tokens=els.tokens.querySelectorAll('.move-token');
    Array.prototype.forEach.call(tokens,function(t){t.classList.remove('hint-next')});
    var target=null;
    if(hintOn&&currentPractice&&mode==='practice'){
      var sol=currentPractice.solution,n=0;
      while(n<sol.length&&n<moves.length&&moves[n]===sol[n])n++;
      if(n<sol.length){if(tokens[n])tokens[n].classList.add('hint-next');target=sol[n]}
    }
    Array.prototype.forEach.call(els.kbdPad.querySelectorAll('button[data-move]'),function(b){b.classList.toggle('hint-key',!!target&&b.getAttribute('data-move')===target)});
  }
  // The move the user should play next, or null when the recorded moves
  // have already diverged from the answer (or the answer is finished).
  function expectedNextMove(){
    if(!currentPractice||mode!=='practice')return null;
    var sol=currentPractice.solution,n=0;
    while(n<sol.length&&n<moves.length&&moves[n]===sol[n])n++;
    return (n<sol.length&&moves.length===n)?sol[n]:null;
  }
  function toggleHint(){
    hintOn=!hintOn;
    els.hintToggle.setAttribute('aria-pressed',hintOn?'true':'false');
    updateHint();
  }

  function pasteSpell(){
    function fallback(){
      openPasteFallback(function(text){
        els.formulaInput.value=text.trim();
        els.formulaErr.textContent='';setKbdMsg('');
        return true;
      });
    }
    if(!navigator.clipboard||!navigator.clipboard.readText){fallback();return}
    navigator.clipboard.readText().then(function(text){
      if(!text||!text.trim()){setKbdMsg('剪贴板是空的');return}
      els.formulaInput.value=text.trim();
      els.formulaErr.textContent='';setKbdMsg('');
    }).catch(fallback);
  }

  // ---- Random scramble: 20 moves, never the same face twice in a row ----
  function randomScramble(){
    var faces=['U','D','L','R','F','B'],suffixes=['',"'",'2'],out=[],last='';
    while(out.length<20){
      var f=faces[Math.floor(Math.random()*faces.length)];
      if(f===last)continue;
      last=f;
      out.push(f+suffixes[Math.floor(Math.random()*suffixes.length)]);
    }
    return out;
  }
  function submitRandomScramble(){
    if(phase==='running'||phase==='replay')return;
    els.formulaInput.value=randomScramble().join(' ');
    els.formulaErr.textContent='';
    submitForward();
  }

  // ---- Scramble flows: forward animates the typed formula (answer = its inverse);
  //      reverse animates the inverse and keeps the typed formula as the answer ----
  function scrambleWith(seq,solution,hintable){
    closeKbd();
    currentPractice={scrambleSeq:seq.slice(),solution:solution.slice(),startState:null,hintable:!!hintable};
    els.scrambleNow.hidden=false;els.scrambleNowText.textContent=seq.join(' ');
    beginScrambleRun(seq,function(){phase='ready';syncUI();els.startBtn.scrollIntoView({behavior:'smooth',block:'nearest'})});
  }
  function submitForward(){
    if(phase==='running'||phase==='replay')return;
    var list=tryParse(els.formulaInput,els.formulaErr);if(!list)return;
    scrambleWith(list,inverseSeq(list),false);
  }
  function submitReverse(){
    if(phase==='running'||phase==='replay')return;
    var list=tryParse(els.formulaInput,els.formulaErr);if(!list)return;
    scrambleWith(inverseSeq(list),list,true);
  }
  function enterPractice(){
    if(mode!=='input'||phase!=='ready'||!currentPractice)return;
    closeKbd();
    currentPractice.startState=copyState();moves=[];
    phase='practice';setMode('practice');renderPracticeTokens();syncUI();
    openKbd('exec');
    try{els.historyInput.focus({preventScroll:true})}catch(e){els.historyInput.focus()}
  }
  function restartPractice(){
    if(!currentPractice||phase==='running'||phase==='replay')return;
    els.success.hidden=true;
    beginScrambleRun(currentPractice.scrambleSeq,function(){
      currentPractice.startState=copyState();phase='practice';syncUI();
      openKbd('exec');
    });
  }
  function backToInput(){
    if(phase==='running')return;
    closeKbd();
    stopAuto();cancelAnimation();inputQueue=[];moves=[];currentPractice=null;
    solved();render();phase='idle';
    els.success.hidden=true;els.replayBar.hidden=true;els.scrambleNow.hidden=true;
    clearActiveTokens();els.play.textContent='';
    setMode('input');syncUI();
  }
  function renderPracticeTokens(){
    els.tokens.innerHTML='';
    els.solutionCount.textContent=currentPractice.solution.length+' 步';
    hintOn=false;els.hintToggle.setAttribute('aria-pressed','false');
    els.hintToggle.hidden=!currentPractice.hintable;
    currentPractice.solution.forEach(function(m,i){var span=document.createElement('span');span.className='move-token';span.dataset.step=i+1;span.textContent=m;els.tokens.appendChild(span)});
  }

  // ---- Replay engine (answer demo) ----
  function prepareReplay(sol,startState){
    playbackMoves=sol.slice();
    playbackStates=[startState.map(function(s){return{p:s.p.slice(),n:s.n.slice(),c:s.c}})];
    var saved=copyState();restore(startState);
    sol.forEach(function(m){applyMove(m,false);playbackStates.push(copyState())});
    restore(saved);playbackIndex=0;updateReplayUI();
  }
  function updateReplayUI(){
    Array.prototype.forEach.call(els.tokens.querySelectorAll('.move-token'),function(token){token.classList.toggle('active',Number(token.dataset.step)===playbackIndex)});
    var total=playbackMoves.length;
    if(playbackIndex===0)els.play.textContent='第 0/'+total+' 步：起始位置（打乱状态）';
    else els.play.textContent='第 '+playbackIndex+'/'+total+' 步：'+playbackMoves[playbackIndex-1];
    els.demoFill.style.width=(total?Math.round(playbackIndex/total*100):0)+'%';
    els.demoCount.textContent=playbackIndex+'/'+total;
    els.prev.disabled=turnAnimating||playbackIndex===0;
    els.next.disabled=turnAnimating||playbackIndex===total;
    els.auto.disabled=turnAnimating||total===0;
    els.exit.disabled=turnAnimating;
  }
  function replayAt(i,done){
    if(!playbackStates.length||turnAnimating)return;
    var target=Math.max(0,Math.min(i,playbackStates.length-1));
    if(phase!=='replay'){restore(playbackStates[0]);playbackIndex=0}
    phase='replay';syncUI();
    var from=playbackIndex,finishStep=function(){updateReplayUI();if(done)done()};
    playbackIndex=target;updateReplayUI();
    if(target===from+1){els.prev.disabled=els.next.disabled=els.auto.disabled=els.exit.disabled=true;animateMove(playbackMoves[from],false,finishStep)}
    else if(target===from-1){els.prev.disabled=els.next.disabled=els.auto.disabled=els.exit.disabled=true;animateMove(inverse(playbackMoves[target]),false,finishStep)}
    else{restore(playbackStates[target]);finishStep()}
  }
  function stopAuto(){if(autoId){clearTimeout(autoId);autoId=null}els.auto.textContent='自动演示';if(phase==='replay')updateReplayUI()}
  function autoReplay(){
    if(autoId){stopAuto();return}
    if(phase!=='replay'||playbackIndex>=playbackMoves.length){restore(playbackStates[0]);playbackIndex=0;phase='replay';syncUI();updateReplayUI()}
    els.auto.textContent='暂停';
    autoId=setTimeout(function step(){if(!autoId)return;if(playbackIndex>=playbackMoves.length){stopAuto();setTimeout(function(){if(phase==='replay'&&!autoId)exitReplay()},750);return}replayAt(playbackIndex+1,function(){if(!autoId)return;autoId=setTimeout(step,420)})},80);
  }
  function startDemo(){
    if(!currentPractice||!currentPractice.startState||phase==='replay'||phase==='running')return;
    closeKbd();
    stopAuto();cancelAnimation();inputQueue=[];
    els.success.hidden=true;
    prepareReplay(currentPractice.solution,currentPractice.startState);
    els.replayBar.hidden=false;
    replayAt(0);
    autoReplay();
  }
  function exitReplay(){
    stopAuto();cancelAnimation();
    if(phase==='replay'&&currentPractice&&currentPractice.startState){restore(currentPractice.startState);moves=[];phase='practice'}
    els.replayBar.hidden=true;clearActiveTokens();els.play.textContent='';
    syncUI();
  }
  // ---- Wiring ----
  els.kbdPaste.addEventListener('click',function(){if(kbdMode==='exec')pasteAndExecute();else pasteSpell()});
  els.kbdDone.addEventListener('click',closeKbd);
  els.pasteConfirm.addEventListener('click',function(){
    if(!pasteApply)return;
    var text=els.pasteText.value;
    if(!text.trim()){els.pasteFbErr.textContent='先把公式粘贴到上面的框里';return}
    if(pasteApply(text))closePasteFallback();
  });
  els.pasteCancel.addEventListener('click',closePasteFallback);
  els.pasteFallback.addEventListener('click',function(e){if(e.target===els.pasteFallback)closePasteFallback()});

  // ---- Formula library: the 2-look OLL/PLL algorithms from the user's
  //      cheatsheet PDF (~/workspace/your_files/2look-oll-pll-cheatsheet),
  //      copied verbatim. Tapping a chip SELECTS that formula as the
  //      solution: it fills the input and immediately runs the reverse
  //      scramble (the inverse sequence, animated), landing on phase
  //      'ready' with the 开始练习 button shown — solving with the
  //      selected formula then restores the cube. The user can still
  //      edit the input afterwards or re-scramble with 正向打乱. ----
  var LIBRARY={
    oll:[
      {name:'Bar',f:"F (R U R' U') F'"},
      {name:'L-Shape',f:"f (R U R' U') f'"},
      {name:'Dot',f:"F (R U R' U') F' f (R U R' U') f'"},
      {name:'Sune',f:"R U R' U R U2 R'"},
      {name:'Antisune',f:"R U2 R' U' R U' R'"},
      {name:'H',f:"R U R' U R U' R' U R U2 R'"},
      {name:'Pi',f:"R U2 R2 U' R2 U' R2 U2 R"},
      {name:'T',f:"r U R' U' r' F R F'"},
      {name:'U',f:"R2 D R' U2 R D' R' U2 R'"},
      {name:'L',f:"F R' F' r U R U' r'"}
    ],
    pll:[
      {name:'T',f:"(R U R' U') R' F R2 U' R' U' R U R' F'"},
      {name:'Y',f:"F R U' R' U' R U R' F' (R U R' U') (R' F R F')"},
      {name:'Ua',f:"R U' R U R U R U' R' U' R2"},
      {name:'Ub',f:"R2 U (R U R' U') R' U' R' U R'"},
      {name:'H',f:"M2 U M2 U2 M2 U M2"},
      {name:'Z',f:"M2 U M2 U M' U2 M2 U2 M' U2"}
    ]
  };
  function buildChips(wrap,list){
    list.forEach(function(item){
      var b=document.createElement('button');b.type='button';b.className='chip';
      var n=document.createElement('span');n.className='chip-name';n.textContent=item.name;
      var f=document.createElement('span');f.className='chip-formula';f.textContent=item.f;
      b.appendChild(n);b.appendChild(f);
      b.addEventListener('click',function(){
        els.formulaInput.value=item.f;
        els.formulaErr.textContent='';
        submitReverse();
      });
      wrap.appendChild(b);
    });
  }
  buildChips(els.ollChips,LIBRARY.oll);
  buildChips(els.pllChips,LIBRARY.pll);
  els.libToggle.addEventListener('click',function(){
    var open=els.libBody.hidden;
    els.libBody.hidden=!open;
    els.libToggle.setAttribute('aria-expanded',open?'true':'false');
  });
  els.randomBtn.addEventListener('click',submitRandomScramble);
  els.forwardBtn.addEventListener('click',submitForward);
  els.reverseBtn.addEventListener('click',submitReverse);
  els.startBtn.addEventListener('click',enterPractice);
  els.demoBtn.addEventListener('click',startDemo);
  els.retry.addEventListener('click',restartPractice);
  els.backBtn.addEventListener('click',backToInput);
  els.successAgainBtn.addEventListener('click',restartPractice);
  els.historyInput.addEventListener('click',function(){openKbd('exec')});
  els.copyBtn.addEventListener('click',copyHistory);
  els.hintToggle.addEventListener('click',toggleHint);
  els.prev.addEventListener('click',function(){stopAuto();replayAt(playbackIndex-1)});
  els.next.addEventListener('click',function(){stopAuto();replayAt(playbackIndex+1)});
  els.auto.addEventListener('click',autoReplay);
  els.exit.addEventListener('click',exitReplay);
  q('resetViewBtn').addEventListener('click',function(){viewX=-24;viewY=-38;updateView()});
  els.formulaInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submitForward()}});
  els.formulaInput.addEventListener('input',function(){els.formulaErr.textContent=''});
  els.formulaInput.addEventListener('focus',function(){openKbd('spell')});
  els.formulaInput.addEventListener('click',function(){openKbd('spell')});
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){if(!els.pasteFallback.hidden){closePasteFallback();return}if(kbdOpen){closeKbd();return}}
    var t=e.target,tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||(t&&t.isContentEditable))return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undoTurn();return}
    if(e.key==='Backspace'){e.preventDefault();undoTurn();return}
    if(/^[udlrfb]$/i.test(e.key)){e.preventDefault();userTurn(e.key.toUpperCase()+(e.shiftKey?"'":''))}
  });
  function updateView(){els.cube.style.transform='rotateX('+viewX+'deg) rotateY('+viewY+'deg)'}
  els.zone.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,vx:viewX,vy:viewY};els.zone.setPointerCapture(e.pointerId)});
  els.zone.addEventListener('pointermove',function(e){if(!drag)return;viewY=drag.vy+(e.clientX-drag.x)*.55;viewX=Math.max(-85,Math.min(85,drag.vx-(e.clientY-drag.y)*.55));updateView()});
  els.zone.addEventListener('pointerup',function(){drag=null});
  els.zone.addEventListener('pointercancel',function(){drag=null});
  solved();buildCube();setMode('input');syncUI();
})();
</script>
</body>
</html>
