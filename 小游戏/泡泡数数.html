<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>泡泡乐园</title>
<style>
  :root{
    --ink:#5b4632; --ink-soft:#8a715a;
    --card:#fffdf7; --line:#e8d9c3;
    --accent:#f2a65a; --accent-soft:#fdeeda;
    --shadow:0 4px 14px rgba(120,84,40,.12);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--ink); overflow:hidden;
    font-family:ui-rounded,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; min-height:44px; }
  button:active{ transform:scale(.96); }

  /* ============ 全屏游戏区（背景即游戏区） ============ */
  #app{
    position:fixed; inset:0; height:100dvh; overflow:hidden;
    transition:background 1.2s ease;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #scene{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  #scene svg{ position:absolute; left:0; bottom:0; width:100%; height:34%; }
  .cloud{
    position:absolute; border-radius:999px; background:rgba(255,255,255,.5);
    filter:blur(2px); pointer-events:none;
  }
  #play{ position:absolute; inset:0; z-index:2; }
  #fxLayer{ position:absolute; inset:0; pointer-events:none; z-index:30; overflow:hidden; }

  /* ============ 悬浮 UI：只剩两个半透明圆钮 ============ */
  .float-ui{ position:absolute; z-index:20; }
  .float-btn{
    width:48px; height:48px; border-radius:50%;
    background:rgba(255,253,247,.55); border:2px solid rgba(255,255,255,.75);
    font-size:22px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(120,84,40,.14); backdrop-filter:blur(3px);
  }
  #btnRestart{ top:calc(10px + env(safe-area-inset-top)); left:12px; }
  #btnSettings{ top:calc(10px + env(safe-area-inset-top)); right:12px; }

  /* 主题横幅：浮现后自动淡出 */
  #banner{
    position:absolute; top:calc(74px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%) translateY(-6px);
    z-index:21; pointer-events:none; white-space:nowrap;
    background:rgba(255,253,247,.78); border:2px solid rgba(255,255,255,.85);
    border-radius:999px; padding:9px 22px; font-size:18px; font-weight:800;
    box-shadow:var(--shadow); opacity:0; transition:opacity .8s ease, transform .8s ease;
  }
  #banner.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* 偶发文字夸奖：浮现后自动淡出，不挡点按 */
  #praise{
    position:absolute; top:26%; left:0; right:0; z-index:26; pointer-events:none;
    text-align:center; font-size:min(13vw,54px); font-weight:900; color:var(--accent);
    text-shadow:0 3px 0 #fff, 0 8px 22px rgba(242,166,90,.4); opacity:0; padding:0 20px;
  }
  #praise.show{ animation:praiseIn 2.6s ease forwards; }
  @keyframes praiseIn{ 0%{opacity:0; transform:scale(.6) rotate(-3deg)} 16%{opacity:1; transform:scale(1.08) rotate(1deg)} 26%{transform:scale(1)} 78%{opacity:1} 100%{opacity:0; transform:scale(1.02)} }

  /* ============ 泡泡 ============ */
  .bubble{
    position:absolute; left:0; top:0; border-radius:50%; cursor:pointer; z-index:5;
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%),
      radial-gradient(circle at 50% 50%, rgba(190,225,250,.30), rgba(160,205,245,.42));
    border:2px solid rgba(255,255,255,.85);
    box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(150,195,240,.28), 0 6px 16px rgba(110,160,210,.18);
    will-change:transform;
  }
  .bubble::after{
    content:""; position:absolute; top:11%; left:16%; width:26%; height:16%;
    border-radius:50%; background:rgba(255,255,255,.85); transform:rotate(-24deg); filter:blur(1px); pointer-events:none;
  }
  .bubble .jelly{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .bubble .glyph{ line-height:1; pointer-events:none; filter:drop-shadow(0 2px 3px rgba(90,70,40,.15)); }
  /* 六色柔和彩色玻璃 tint */
  .bubble.c-pink{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(248,196,214,.45), rgba(243,156,182,.52)); border-color:rgba(255,225,235,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(240,150,180,.30), 0 6px 16px rgba(235,150,180,.22); }
  .bubble.c-blue{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(178,220,248,.45), rgba(140,195,240,.52)); border-color:rgba(220,240,255,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(140,190,240,.30), 0 6px 16px rgba(130,185,240,.22); }
  .bubble.c-green{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(196,236,205,.45), rgba(150,210,165,.52)); border-color:rgba(225,248,230,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(140,205,160,.30), 0 6px 16px rgba(140,205,155,.22); }
  .bubble.c-yellow{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(252,232,160,.48), rgba(246,205,95,.52)); border-color:rgba(255,244,200,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(240,200,95,.30), 0 6px 16px rgba(240,200,95,.24); }
  .bubble.c-purple{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(224,210,244,.48), rgba(192,165,228,.52)); border-color:rgba(240,232,255,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(185,160,225,.30), 0 6px 16px rgba(180,155,225,.24); }
  .bubble.c-orange{ background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.35) 34%, rgba(255,255,255,.08) 55%), radial-gradient(circle at 50% 50%, rgba(255,220,175,.48), rgba(250,180,105,.54)); border-color:rgba(255,238,215,.95); box-shadow: inset 0 0 18px rgba(255,255,255,.55), inset -6px -8px 16px rgba(245,175,100,.32), 0 6px 16px rgba(245,175,100,.24); }
  .fx-ribbon{ position:absolute; border-radius:999px; will-change:transform,opacity; pointer-events:none; }
  .fx-dot{ position:absolute; border-radius:50%; will-change:transform,opacity; pointer-events:none; }
  .bubble.popping{ transition:transform .38s ease, opacity .38s ease; opacity:0; }
  /* 金色惊喜泡泡 */
  .bubble.gold{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.98) 0%, rgba(255,240,190,.5) 34%, rgba(255,215,110,.18) 55%),
      radial-gradient(circle at 50% 50%, rgba(255,226,140,.5), rgba(250,195,70,.55));
    border-color:rgba(255,236,170,.95);
    box-shadow: inset 0 0 20px rgba(255,244,200,.8), inset -6px -8px 16px rgba(240,190,80,.35), 0 6px 22px rgba(245,190,70,.5);
  }
  /* 彩虹惊喜泡泡 */
  .bubble.rainbow{
    background:
      radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.3) 32%, rgba(255,255,255,.06) 52%),
      conic-gradient(from 210deg, rgba(246,198,211,.5), rgba(249,226,156,.5), rgba(196,230,205,.5), rgba(191,224,242,.5), rgba(221,208,238,.5), rgba(246,198,211,.5));
    box-shadow: inset 0 0 18px rgba(255,255,255,.6), 0 6px 22px rgba(190,170,230,.45);
  }
  /* 泡泡雨的小空泡泡 */
  .bubble.rain{ z-index:4; opacity:.92; }

  /* 点破涟漪 */
  .ripple{
    position:absolute; border-radius:50%; pointer-events:none; z-index:6;
    border:3px solid rgba(255,255,255,.9);
    box-shadow:0 0 0 3px rgba(242,200,120,.35), inset 0 0 12px rgba(255,255,255,.6);
    animation:rippleOut 1.4s ease-out forwards;
  }
  @keyframes rippleOut{ 0%{ transform:scale(.35); opacity:.95; } 100%{ transform:scale(1.9); opacity:0; } }

  /* 点破后跳舞飘走的图案 */
  .dancer{ position:absolute; z-index:18; pointer-events:none; line-height:1; will-change:transform,opacity;
    filter:drop-shadow(0 3px 5px rgba(90,70,40,.2)); }
  .mini-star{ position:absolute; z-index:18; pointer-events:none; line-height:1; will-change:transform,opacity; }

  /* ============ 特效粒子（全部慢速柔和） ============ */
  .confetti{ position:absolute; border-radius:3px; will-change:transform,opacity; }
  .fx-star{ position:absolute; will-change:transform,opacity; line-height:1; }
  .fx-bub{ position:absolute; border-radius:50%; will-change:transform,opacity; pointer-events:none;
    background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95), rgba(255,255,255,.25) 45%, rgba(170,210,245,.4));
    border:1.5px solid rgba(255,255,255,.85); }
  #rainbowSvg{ position:absolute; left:50%; bottom:8%; transform:translateX(-50%); width:min(92vw,560px); height:auto; }

  /* ============ 设置面板（一屏放完不滚动） ============ */
  .overlay{
    position:absolute; inset:0; z-index:50; display:none; flex-direction:column;
    padding:calc(6px + env(safe-area-inset-top)) 16px calc(8px + env(safe-area-inset-bottom));
    transition:background 1.2s ease, opacity .25s ease;
  }
  .overlay.faded{ opacity:0; pointer-events:none; }
  .overlay.open{ display:flex; }
  .overlay h2{ margin:0 0 6px; font-size:21px; text-align:center; flex:none; }
  .set-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex:none; }
  .set-row .lab{ font-size:15.5px; font-weight:800; color:var(--ink-soft); width:74px; flex:none; }
  .seg{ flex:1; display:flex; gap:5px; background:rgba(255,253,247,.9); border:2px solid var(--line); border-radius:999px; padding:3px; }
  .seg button{ flex:1; border-radius:999px; font-weight:700; font-size:15.5px; color:var(--ink-soft); min-height:36px; padding:2px 0; }
  .seg button.on{ background:var(--accent); color:#fff; }
  .summary-row{
    flex:1; display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border:2px solid var(--line); border-radius:16px; padding:4px 14px;
    font-size:16px; font-weight:700; box-shadow:var(--shadow); min-height:46px; text-align:left;
  }
  .summary-row .sw{ width:26px; height:26px; border-radius:50%; flex:none; border:2px solid rgba(255,255,255,.9); box-shadow:0 1px 4px rgba(120,84,40,.25); }
  .summary-row .chev{ color:var(--ink-soft); font-weight:900; }
  .done-btn{
    margin-top:auto; flex:none; background:var(--accent); color:#fff; font-size:19px; font-weight:800;
    border-radius:999px; padding:8px; box-shadow:0 4px 14px rgba(242,166,90,.45); min-height:48px; width:100%;
  }
  .picker-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; overflow-y:auto; min-height:0; padding-bottom:8px; -webkit-overflow-scrolling:touch; }
  .picker-grid button{
    background:var(--card); border:2px solid var(--line); border-radius:16px; font-size:15.5px; font-weight:700;
    padding:7px 8px; box-shadow:var(--shadow); min-height:48px; display:flex; align-items:center; gap:8px; text-align:left;
  }
  .picker-grid button.on{ border-color:var(--accent); background:var(--accent-soft); }
  .picker-grid .pg-glyph{ font-size:22px; flex:none; }
  .picker-grid .pg-sw{ width:30px; height:30px; border-radius:50%; flex:none; border:2px solid rgba(255,255,255,.9); box-shadow:0 1px 4px rgba(120,84,40,.25); }
  .back-btn{
    flex:none; align-self:flex-start; display:flex; align-items:center; gap:4px;
    background:rgba(255,253,247,.85); border:2px solid var(--line); border-radius:999px;
    font-size:16px; font-weight:800; padding:4px 18px 4px 12px; box-shadow:var(--shadow); min-height:40px; margin-bottom:6px;
  }
  /* 设置紧凑排版：特效逐项开关两列 chip */
  #settingsPanel .seg button{ min-height:35px; }
  .fx-chips{ flex:1; display:grid; grid-template-columns:1fr 1fr; gap:5px; }
  .fx-chip{ display:flex; align-items:center; justify-content:space-between; gap:6px; background:rgba(255,253,247,.9); border:2px solid var(--line); border-radius:999px; padding:2px 10px; min-height:31px; font-size:14px; font-weight:700; color:var(--ink-soft); }
  .fx-chip.on{ border-color:var(--accent); background:var(--accent-soft); color:var(--ink); }
  .fx-chip .dot{ width:10px; height:10px; border-radius:50%; background:#d8cbb6; flex:none; }
  .fx-chip.on .dot{ background:var(--accent); }
  .fx-toggles-row{ align-items:flex-start; }
  .fx-toggles-row .lab{ padding-top:7px; }
  /* 布尔开关两列紧凑 chip 网格（主设置页） */
  .bool-grid{ display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:4px; flex:none; }
  .bool-grid .fx-chip{ width:100%; }
  /* 设置 Tab 式（照记忆翻牌）：顶部常驻 Tab 栏 + 返回常驻，每 Tab 一屏不滚动 */
  .tab-bar{ display:flex; gap:5px; background:rgba(255,253,247,.9); border:2px solid var(--line); border-radius:999px; padding:3px; flex:none; margin-bottom:7px; }
  .tab-bar button{ flex:1; border-radius:999px; font-weight:800; font-size:16px; color:var(--ink-soft); min-height:36px; padding:2px 0; }
  .tab-bar button.on{ background:var(--accent); color:#fff; }
  .tab-pane{ flex:1; display:flex; flex-direction:column; min-height:0; }
  .tab-pane[hidden]{ display:none; }
  /* 特效 Tab：19 个独立开关三列紧凑 chips */
  #tab-fx .fx-chips{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; align-content:start; flex:none; }
  #tab-fx .fx-chip{ min-height:31px; font-size:13px; padding:2px 7px; gap:4px; }
  /* 泡泡拖尾：身后淡淡轨迹，快速淡出 */
  .trail{ position:absolute; border-radius:50%; pointer-events:none; z-index:4; will-change:transform,opacity; }
  /* 慌张小汗滴 / 感叹号粒子 */
  .fx-sweat{ position:absolute; will-change:transform,opacity; line-height:1; pointer-events:none; font-weight:900; }
  /* 生命特效层：呼吸/形变/闪光/色彩流转（只作用内层，不影响位置与命中） */
  .bubble .life{ position:absolute; inset:0; pointer-events:none; }
  .bubble .sheen{ position:absolute; inset:0; border-radius:50%; pointer-events:none; opacity:0; }
  .bubble .shine{ position:absolute; left:16%; top:12%; width:36%; height:26%; border-radius:50%; pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,255,255,.95), rgba(255,255,255,0)); filter:blur(1px); }
  .bubble .twinkle{ position:absolute; pointer-events:none; line-height:1; color:#fff; opacity:0;
    text-shadow:0 0 7px rgba(255,255,255,.95), 0 0 3px rgba(255,255,255,.8); }
  /* 空白处按下涟漪 */
  .touch-ripple{ position:absolute; border-radius:50%; pointer-events:none; z-index:3;
    border:3px solid rgba(255,255,255,.8); box-shadow:0 0 20px rgba(255,255,255,.55), inset 0 0 16px rgba(255,255,255,.5);
    animation:touchRipple 1.05s ease-out forwards; }
  @keyframes touchRipple{ 0%{ transform:scale(.3); opacity:.95; } 100%{ transform:scale(1); opacity:0; } }
  #play{ touch-action:none; }
  #tab-sound .fx-chip{ min-height:46px; font-size:16.5px; padding:2px 16px; }
  /* ============ 滑条一行式：左标题 / 中滑条 / 右数值，连续可调（不吸附档位） ============ */
  .srow{ display:grid; grid-template-columns:62px 1fr 54px; align-items:center; gap:8px; min-height:32px; flex:none; }
  .srow .lab{ font-size:14.5px; font-weight:800; color:var(--ink-soft); line-height:1.15; }
  .srow .snote{ display:block; font-size:9.5px; font-weight:600; color:var(--ink-soft); opacity:.78; margin-top:1px; }
  .srow .sval{ font-size:15px; font-weight:800; color:var(--accent); text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .srow input[type=range]{ width:100%; height:26px; margin:0; padding:0; background:transparent; -webkit-appearance:none; appearance:none; display:block; }
  .srow input[type=range]::-webkit-slider-runnable-track{ height:6px; border-radius:3px; background:#f7e3c2; }
  .srow input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:#fff; border:3px solid var(--accent); margin-top:-9px; box-shadow:0 2px 6px rgba(120,84,40,.28); cursor:pointer; }
  .srow input[type=range]::-moz-range-track{ height:6px; border-radius:3px; background:#f7e3c2; }
  .srow input[type=range]::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:#fff; border:3px solid var(--accent); box-shadow:0 2px 6px rgba(120,84,40,.28); cursor:pointer; }
  /* 泡泡 Tab 开关分组小标题 + 三列紧凑 chips */
  .chip-group-title{ font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:4px 0 2px; flex:none; }
  .chip-group-title:first-child{ margin-top:0; }
  .chips3{ grid-template-columns:1fr 1fr 1fr; }
  .chips3 .fx-chip{ min-height:25px; font-size:12.5px; padding:2px 6px; gap:3px; }
  /* 动态效果可展开区：默认收起，摘要行显示已开 n/15；展开只在 Tab 内占位 */
  .dyn-toggle{ display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; flex:none;
    background:rgba(255,253,247,.9); border:2px solid var(--line); border-radius:999px;
    padding:2px 12px; min-height:32px; margin:4px 0 2px; font-size:13.5px; font-weight:800; color:var(--ink-soft); }
  .dyn-toggle .chev{ font-weight:900; transition:transform .2s ease; }
  .dyn-toggle.open .chev{ transform:rotate(90deg); }
  #bubbleChips{ margin-top:2px; }
  #bubbleChips[hidden]{ display:none; }
  .bool-grid.chips3{ margin-bottom:2px; }
  /* chip 名称区 = 预览触发（点名称只看演示、不改开关） */
  .pv-name{ cursor:pointer; }
  /* ============ 特效演示舞台：独立于设置 DOM、全屏透明、z-index 高于一切 ============ */
  #previewStage{ position:absolute; inset:0; z-index:90; display:none; }
  #previewStage.on{ display:block; }
  #pvLabel{
    position:absolute; top:calc(64px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    z-index:97; pointer-events:none; white-space:nowrap; display:none;
    background:rgba(255,253,247,.88); border:2px solid rgba(255,255,255,.9);
    border-radius:999px; padding:7px 20px; font-size:17px; font-weight:800; color:var(--ink);
    box-shadow:var(--shadow); text-align:center;
  }
  #pvLabel.on{ display:block; }
  #pvLabel .pv-hint{ display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-top:1px; }
  #pvBubbleWrap{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); }
  /* ============ 新增泡泡动态效果元素（只用 transform/opacity） ============ */
  .mid,.pulse{ position:absolute; inset:0; pointer-events:none; }
  .dyn-ripple{ position:absolute; inset:9%; border-radius:50%; border:2.5px solid rgba(255,255,255,.75); opacity:0; pointer-events:none; }
  .halo{ position:absolute; inset:-13%; border-radius:50%; pointer-events:none; }
  .gshadow{ position:absolute; left:6%; right:6%; top:85%; height:20%; border-radius:50%; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(96,118,150,.30), rgba(96,118,150,0) 68%); }
  .orbit{ position:absolute; inset:-7%; pointer-events:none; }
  .orbit .ostar{ position:absolute; left:50%; top:0; transform:translate(-50%,-50%); line-height:1; filter:drop-shadow(0 0 4px rgba(255,255,255,.9)); }
  .redge{ position:absolute; inset:0; border-radius:50%; pointer-events:none; opacity:.75;
    background:conic-gradient(from 0deg, rgba(242,160,160,.9), rgba(247,201,138,.9), rgba(249,226,156,.9), rgba(168,216,160,.9), rgba(158,207,236,.9), rgba(195,174,224,.9), rgba(242,160,160,.9));
    -webkit-mask:radial-gradient(farthest-side, rgba(0,0,0,0) calc(100% - 6px), #000 calc(100% - 5px));
    mask:radial-gradient(farthest-side, rgba(0,0,0,0) calc(100% - 6px), #000 calc(100% - 5px)); }
  .blowb{ position:absolute; left:74%; top:20%; border-radius:50%; opacity:0; pointer-events:none;

    o.start(t0); o2.start(t0); o.stop(t0+dur+0.05); o2.stop(t0+dur+0.05);
  }
  /* 轻音乐：八音盒慢速摇篮曲循环（小星星旋律，0 表示休止） */
  var musicOn=false, musicTimer=null, musicNext=0, musicIdx=0;
  var MELODY=[262,262,392,392,440,440,392,0,349,349,330,330,294,294,262,0,392,392,349,349,330,330,294,0,392,392,349,349,330,330,294,0,262,262,392,392,440,440,392,0,349,349,330,330,294,294,262,0];
  function mtone(freq,when){
    var c=ac(); if(!c) return;
    var o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), g2=c.createGain();
    o.type="sine"; o.frequency.value=freq;
    o2.type="triangle"; o2.frequency.value=freq*2; g2.gain.value=0.18;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
    g.gain.setValueAtTime(0.0001,when);
    g.gain.exponentialRampToValueAtTime(0.30,when+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,when+1.5);
    o.start(when); o2.start(when); o.stop(when+1.6); o2.stop(when+1.6);
  }
  function musicTick(){
    if(!musicOn) return;
    var c=ac(); if(!c) return;
    if(!musicNext || musicNext<c.currentTime) musicNext=c.currentTime+0.1;
    while(musicNext<c.currentTime+0.9){
      var f=MELODY[musicIdx%MELODY.length]; musicIdx++;
      if(f) mtone(f,musicNext);
      musicNext+=0.52;
      if(musicIdx%MELODY.length===0) musicNext+=1.8; /* 每遍之间歇一会儿 */

    setMusic:function(v){

    unlock:function(){ ac(); if(musicOn) musicStart(); },

    popNote:function(sizeClass){

/* 速度改连续倍率（0.3–3.0）：以原「适中」档为 1.0 基准，漂移速度线性缩放、生成间隔按幂律缩放，

function speedCfg(){
  var m=settings.speedMult||1.0;
  return { drift:38*m, vary:7+7*m, spawn:1250*Math.pow(m,-0.7) };
}
/* 同屏上限：按视口面积动态算，再按尺寸倍率重算（泡泡越大同屏越少、防挤），泡泡量倍率（0.4–1.6）在上限内调整 */
function targetCount(){
  var W=window.innerWidth, H=window.innerHeight;
  var f=settings.sizeMult||1.0;
  var base=Math.floor(W*H/29000/f);
  base=Math.max(5, Math.min(14, base));
  var df=settings.countMult||1.0; /* 泡泡量连续倍率，仍受同屏上限封顶 */
  var n=Math.round(base*df);
  return Math.max(4, Math.min(14, n));
}
/* 泡泡尺寸：尺寸倍率（0.7–1.8）整体缩放三档基础尺寸（84/108/138）的分布；最小泡不低于约 68px，封顶不超过屏宽 55% */
function pickSize(){
  var f=settings.sizeMult||1.0;
  var r=Math.random();
  var cls = r<0.34 ? "S" : r<0.72 ? "M" : "L";
  var base = cls==="S" ? 84 : cls==="M" ? 108 : 138;
  var px=Math.max(68, Math.round(base*f));
  var cap=Math.floor(window.innerWidth*0.55);
  return { cls:cls, px:Math.min(px, cap) };
}

  var off=size+14, edge=Math.floor(Math.random()*4), x,y,vx,vy;

function makeSpawn(size){

  var W=window.innerWidth, H=window.innerHeight;
  var cfg=speedCfg();
  var spd=cfg.drift+Math.random()*cfg.vary;
  var best=null;
  for(var attempt=0; attempt<12; attempt++){

    var off=size+14; /* 一律在屏外至少一个直径处生成，带初速度丝滑漂入，禁止屏内凭空出现 */
    if(edge<0.42){ x=Math.random()*Math.max(1,(W-size)); y=H+off; vx=(Math.random()*14-7); vy=-spd; }
    else if(edge<0.62){ x=-size-off; y=H*0.15+Math.random()*H*0.5; vx=spd*0.9; vy=(Math.random()*10-5); }
    else if(edge<0.82){ x=W+off; y=H*0.15+Math.random()*H*0.5; vx=-spd*0.9; vy=(Math.random()*10-5); }
    else { x=Math.random()<0.5? W*0.06 : W*0.78; y=-size-off; vx=(Math.random()*16-8); vy=spd*0.75; }

  el.addEventListener("pointerdown",function(ev){ ev.preventDefault(); ev.stopPropagation(); popBubble(b); });
  bubbles.push(b);
  applyLife(b); applySparkle(b); applyHue(b); applySpin(b); applyDynFx(b);
}
/* 维持目标数量：缺口越大补给越快（缺满时约 0.3 秒一个），接近目标放慢到基础间隔，达标即停补；
   「补给速度」连续倍率整体缩放节奏。开局首批也走这条链，天然错峰逐个从屏外滑入。 */
function refillInterval(){
  var target=targetCount(), cur=bubbles.length;
  if(cur>=target) return 900;
  var frac=(target-cur)/target;
  var scale = settings.refillMult||1.0; /* 补给间隔倍率（0.4–2.0）：越小补得越快，整体缩放补给间隔 */
  var base=speedCfg().spawn, fast=300;
  return (fast+(base-fast)*(1-frac))*scale*(0.85+Math.random()*0.3);
}
function refillLoop(){
  clearTimeout(refillTimer);
  refillTimer=setTimeout(function(){
    if(bubbles.length<targetCount()) spawnBubble();
    refillLoop();
  }, refillInterval());
}
function clampSpeed(b){
  var cfg=speedCfg();
  var max=(cfg.drift+cfg.vary)*1.2*effMult, min=cfg.drift*0.4; /* 碰撞限速随加速倍率同步放大，回落后恢复 */
  var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
  if(sp>max){ b.vx*=max/sp; b.vy*=max/sp; }
  else if(sp>0.01 && sp<min){ b.vx*=min/sp; b.vy*=min/sp; }
}
/* ================= 空白处加速：短按 0.8 秒脉冲 / 长按持续，全场倍率平滑升降 ================= */
var boostMult=1, boostHeld=false, boostPressT=0, boostPulseUntil=0;
function spawnTouchRipple(x,y){
  var d=document.createElement("div"); d.className="touch-ripple";
  var s=130; d.style.width=s+"px"; d.style.height=s+"px";
  d.style.left=(x-s/2)+"px"; d.style.top=(y-s/2)+"px";
  fxLayer.appendChild(d); setTimeout(function(){ d.remove(); },1100);
}
play.addEventListener("pointerdown",function(ev){
  if(ev.target!==play) return; /* 只认背景层：点中泡泡仍是点破，互不串扰 */
  boostHeld=true; boostPressT=performance.now();
  spawnTouchRipple(ev.clientX,ev.clientY);
});
function boostRelease(){
  if(!boostHeld) return;
  boostHeld=false;
  if(performance.now()-boostPressT<260) boostPulseUntil=performance.now()+800; /* 短按：约 0.8 秒加速脉冲 */
}
window.addEventListener("pointerup",boostRelease);
window.addEventListener("pointercancel",function(){ boostHeld=false; });
/* 指针位置追踪：害羞泡泡靠它判断「手指靠近了」 */
var lastPointer={ x:-9999, y:-9999, t:0 };
window.addEventListener("pointermove",function(ev){ lastPointer.x=ev.clientX; lastPointer.y=ev.clientY; lastPointer.t=performance.now(); },{ passive:true });
window.addEventListener("pointerdown",function(ev){ lastPointer.x=ev.clientX; lastPointer.y=ev.clientY; lastPointer.t=performance.now(); });

/* ================= 慌张反应：快速连点触发，未破泡泡加速 + 躲避 + 冒汗（可爱向，无警报音、音调不变） ================= */
var popTimes=[], panicUntil=0, panicLevel=0, lastPopX=-9999, lastPopY=-9999, lastSweatAt=0, effMult=1;
function notePopForPanic(cx,cy){
  lastPopX=cx; lastPopY=cy;
  if(!settings.panic) return;
  var now=performance.now();
  popTimes.push(now);
  while(popTimes.length && now-popTimes[0]>2000) popTimes.shift();
  var fast = popTimes.length>=4; /* 约 2 秒内点破 ≥4 个 */
  if(!fast && popTimes.length>=4){ /* 或连续 3 次点破间隔都 <350ms */
    var n=popTimes.length;
    if(now-popTimes[n-2]<350 && popTimes[n-2]-popTimes[n-3]<350 && popTimes[n-3]-popTimes[n-4]<350) fast=true;
  }
  if(fast) panicUntil=now+3000; /* 持续到最后一次快速点破后约 3 秒，tick 里平滑进出 */
  /* 慢速点破：窗口内凑不满 4 个，永不触发 */
}
function spawnSweat(b){ /* 偶发小汗滴 / 「！」从泡泡旁冒出 */
  var bang=Math.random()<0.4;
  var d=document.createElement("div"); d.className="fx-sweat";
  d.textContent=bang?"!":"💧";
  d.style.fontSize=(bang?21:15)+"px";
  if(bang) d.style.color="#f2a65a";
  d.style.left=(b.x+b.size*0.74)+"px"; d.style.top=(b.y+b.size*0.02)+"px";
  fxLayer.appendChild(d);
  d.animate([
    { transform:"translate(0,0) scale(.5)", opacity:0 },
    { transform:"translate(4px,-15px) scale(1.1)", opacity:1, offset:0.35 },
    { transform:"translate(7px,-29px) scale(1)", opacity:0 }
  ],{ duration:750, easing:"ease-out" }).onfinish=function(){ d.remove(); };
}
/* ================= 泡泡拖尾：移动时身后留淡淡轨迹，快速淡出（慢速时几乎不可见） ================= */
function spawnTrail(b){
  if(play.childElementCount>110) return;
  var d=document.createElement("div"); d.className="trail";
  var sz=b.size*0.92;
  d.style.width=sz+"px"; d.style.height=sz+"px";
  d.style.left=(b.x+(b.size-sz)/2)+"px"; d.style.top=(b.y+(b.size-sz)/2)+"px";
  d.style.background = b.special
    ? "radial-gradient(circle at 50% 50%, rgba(250,205,95,.45), rgba(255,255,255,0) 70%)"
    : b.color
      ? "radial-gradient(circle at 50% 50%, "+TINTS[b.color]+", rgba(255,255,255,0) 70%)"
      : "radial-gradient(circle at 50% 50%, rgba(190,225,250,.4), rgba(255,255,255,0) 70%)";
  play.appendChild(d);
  d.animate([
    { transform:"scale(1)", opacity:0.34 },
    { transform:"scale(.68)", opacity:0 }
  ],{ duration:480, easing:"ease-out" }).onfinish=function(){ d.remove(); };
}
/* 简单弹性碰撞：等质量交换法向速度分量，之后限速防失控 */
function collideBubbles(){
  for(var i=0;i<bubbles.length;i++){
    for(var j=i+1;j<bubbles.length;j++){
      var a=bubbles[i], c=bubbles[j];
      if(!a.entered || !c.entered) continue; /* 还没完整滑入的不参与互碰 */
      var dx=(c.x+c.size/2)-(a.x+a.size/2), dy=(c.y+c.size/2)-(a.y+a.size/2);
      var rr=(a.size+c.size)/2, d2=dx*dx+dy*dy;
      if(d2>0.01 && d2<rr*rr){
        var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, overlap=(rr-d)/2;
        a.x-=nx*overlap; a.y-=ny*overlap;
        c.x+=nx*overlap; c.y+=ny*overlap;
        var avn=a.vx*nx+a.vy*ny, cvn=c.vx*nx+c.vy*ny;
        if(avn-cvn>0){
          a.vx+=(cvn-avn)*nx; a.vy+=(cvn-avn)*ny;
          c.vx+=(avn-cvn)*nx; c.vy+=(avn-cvn)*ny;
          clampSpeed(a); clampSpeed(c);
          var horiz=Math.abs(nx)>=Math.abs(ny); /* 互碰瞬间沿碰撞方向挤压一下 */
          squashBubble(a,horiz); squashBubble(c,horiz);
        }
        a.el.style.transform="translate("+a.x+"px,"+a.y+"px)";
        c.el.style.transform="translate("+c.x+"px,"+c.y+"px)";
      }
    }
  }
}
function tick(ts){
  if(!lastTs) lastTs=ts;
  var dt=Math.min(0.05,(ts-lastTs)/1000); lastTs=ts;
  var W=window.innerWidth, H=window.innerHeight;
  /* 空白处加速倍率：目标 3 倍时约 0.4 秒爬升到位，松手平滑回落，不突变 */
  var wantBoost=(boostHeld||performance.now()<boostPulseUntil)?3:1;
  var bRate=wantBoost>boostMult?5:3.4;
  boostMult+=Math.max(-bRate*dt,Math.min(bRate*dt,wantBoost-boostMult));
  /* 慌张程度平滑进出：触发后升起、结束约 3 秒后缓缓恢复常态 */
  var nowMs=performance.now();
  var pTarget=(settings.panic && nowMs<panicUntil)?1:0;
  var pRate=pTarget>panicLevel?2.4:1.1;
  panicLevel+=Math.max(-pRate*dt,Math.min(pRate*dt,pTarget-panicLevel));
  if(panicLevel<0.01 && pTarget===0) panicLevel=0;
  effMult=Math.min(4.5, boostMult*(1+0.6*panicLevel)); /* 慌张额外 ×1.6，与空白加速相乘、总倍率封顶 4.5 */
  /* 微风事件强度包络：约 0.8 秒吹入、约 0.8 秒停歇，风停平滑恢复 */
  var breezeStr=0;
  if(breeze.active){ var bAge=(nowMs-breeze.start)/1000, bLeft=(breeze.until-nowMs)/1000; breezeStr=Math.max(0,Math.min(1,bAge/0.8,bLeft/0.8)); }
  var i,b;
  for(i=bubbles.length-1;i>=0;i--){
    b=bubbles[i];
    b.phase+=dt*0.7;
    b.age+=dt;
    /* 速度变化：速度大小按各自慢周期正弦游走（±35%，周期 4–9 秒），关掉则恒速；
       每帧把速度大小拉回游走值，碰撞/反弹后也按此恢复，不叠加失控 */
    var wf = settings.speedWobble ? 1+0.35*Math.sin((Math.PI*2*b.age)/b.wobPeriod + b.wobPhase) : 1;
    var dsp=b.speedBase*wf, csp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(csp>0.01){ b.vx*=dsp/csp; b.vy*=dsp/csp; }
    b.x+=b.vx*dt*effMult + Math.cos(b.phase)*b.sway*dt;
    b.y+=b.vy*dt*effMult + Math.sin(b.phase*0.8)*b.sway*0.6*dt;
    /* 慌张躲避：离最近点破点较近的泡泡轻轻逃离点击点（范围有限，不满屏乱窜） */
    if(panicLevel>0.05){
      var pdx=(b.x+b.size/2)-lastPopX, pdy=(b.y+b.size/2)-lastPopY;
      var pd=Math.sqrt(pdx*pdx+pdy*pdy);
      if(pd>1 && pd<200){
        var df=115*panicLevel*(1-pd/200);
        b.x+=pdx/pd*df*dt; b.y+=pdy/pd*df*dt;
      }
    }
    /* 微风：全场泡泡被轻轻往同一方向吹偏 */
    if(breezeStr>0) b.x+=breeze.dir*30*breezeStr*dt;
    /* 害羞泡泡：指针靠近到约 60px 时轻轻侧移躲开半步（最多躲 2 次、速度不快、仍可点中） */
    if(b.shy && b.dodges<2){
      if(b.dodgeT>0){ b.x+=b.dodgeVX*dt; b.y+=b.dodgeVY*dt; b.dodgeT-=dt; }
      else if(nowMs-lastPointer.t<4000){
        var sdx=(b.x+b.size/2)-lastPointer.x, sdy=(b.y+b.size/2)-lastPointer.y;
        var sd=Math.sqrt(sdx*sdx+sdy*sdy);
        if(sd>1 && sd<b.size/2+60){
          var dspd=b.size*0.5/0.38;
          b.dodgeVX=sdx/sd*dspd; b.dodgeVY=sdy/sd*dspd; b.dodgeT=0.38; b.dodges++;
        }
      }
    }
    /* 慌张时呼吸/形变频率翻倍 */
    var pr=1+panicLevel;
    if(b.lifeAnim) b.lifeAnim.playbackRate=pr;
    if(b.deformAnim) b.deformAnim.playbackRate=pr;
    if(b.x+b.size>0 && b.x<W && b.y+b.size>0 && b.y<H) b.hasEntered=true;
    if(b.x>=0 && b.y>=0 && b.x+b.size<=W && b.y+b.size<=H) b.entered=true;
    if(settings.collide){
      /* 完整进入后才碰壁反弹；还在滑入途中的不拦 */
      if(b.entered){
        if(b.x<=0 && b.vx<0){ b.x=0; b.vx=-b.vx; squashBubble(b,true); }
        if(b.x+b.size>=W && b.vx>0){ b.x=W-b.size; b.vx=-b.vx; squashBubble(b,true); }
        if(b.y<=0 && b.vy<0){ b.y=0; b.vy=-b.vy; squashBubble(b,false); }
        if(b.y+b.size>=H && b.vy>0){ b.y=H-b.size; b.vy=-b.vy; squashBubble(b,false); }
      }
    } else if((b.hasEntered && (b.x<-b.size-70 || b.x>W+70 || b.y<-b.size-70 || b.y>H+70)) || (!b.hasEntered && b.age>25)){
      b.el.remove(); bubbles.splice(i,1); continue; /* 飘走自动补，不惩罚 */
    }
    b.el.style.transform="translate("+b.x+"px,"+b.y+"px)";
    /* 拖尾：速度够快时才留痕（慢速几乎不可见，快速/慌张/加速时明显） */
    if(settings.trail && !REDUCED){
      var spdEff=Math.sqrt(b.vx*b.vx+b.vy*b.vy)*effMult;
      if(spdEff>55 && ts-b.lastTrail>90){ b.lastTrail=ts; spawnTrail(b); }
    }
  }
  if(settings.collide) collideBubbles();
  /* 慌张冒汗：偶发小汗滴/「！」从靠近点破点的泡泡旁冒出 */
  if(panicLevel>0.4 && nowMs-lastSweatAt>450 && bubbles.length){
    lastSweatAt=nowMs;
    var near=[];
    for(i=0;i<bubbles.length;i++){
      var bb=bubbles[i];
      var ddx=(bb.x+bb.size/2)-lastPopX, ddy=(bb.y+bb.size/2)-lastPopY;
      if(ddx*ddx+ddy*ddy<230*230) near.push(bb);
    }
    var src=near.length?near[Math.floor(Math.random()*near.length)]:bubbles[Math.floor(Math.random()*bubbles.length)];
    if(src) spawnSweat(src);
  }
  for(i=rainBubbles.length-1;i>=0;i--){
    b=rainBubbles[i];
    b.phase+=dt*0.9;
    b.x+=Math.cos(b.phase)*12*dt;
    b.y+=b.vy*dt*effMult;
    if(b.y>H+50){ b.el.remove(); rainBubbles.splice(i,1); continue; }
    b.el.style.transform="translate("+b.x+"px,"+b.y+"px)";
  }
  rafId=requestAnimationFrame(tick);
}

function jellyNeighbors(cx,cy){

function popBubble(b){
  if(b.counted) return;
  b.counted=true;
  var idx=bubbles.indexOf(b); if(idx>=0) bubbles.splice(idx,1);
  var cx=b.x+b.size/2, cy=b.y+b.size/2;
  notePopForPanic(cx,cy); /* 快速连点检测：触发「慌张反应」 */
  noteChain(b); /* 同色连锁检测：6 秒内连破 3 个同色触发小庆祝 */
  AudioBox.popNote(b.cls);
  if(settings.vibrate){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
  if(b.special){
    spawnRipple(b.x,b.y,b.size,"rgba(255,215,120,.95)");
  } else if(!settings.colorful){
    /* 彩色关：透明玻璃泡泡，点破特效从全部已开启的特效里随机出一种 */
    spawnRipple(b.x,b.y,b.size);
    spawnRandomFx(cx,cy);
  } else if(b.color==="orange"){
    spawnRipple(b.x,b.y,b.size,"rgba(250,170,80,.95)"); /* 橙族带一圈柔光涟漪 */
    spawnFamilyFx("orange",cx,cy);
  } else {
    spawnRipple(b.x,b.y,b.size);
    /* 按颜色分特效：每色一族 3 种随机出；该族全关时只剩基础效果（图案跳舞+涟漪） */
    spawnFamilyFx(b.color,cx,cy);
  }
  if(b.shy){ /* 害羞泡泡点破：双倍粒子特效 */
    if(b.color) spawnFamilyFx(b.color,cx,cy); else spawnRandomFx(cx,cy);
  }
  jellyNeighbors(cx,cy);
  b.el.classList.add("popping");
  b.el.style.transform="translate("+b.x+"px,"+b.y+"px) scale(1.22)";
  var dead=b.el; setTimeout(function(){ dead.remove(); },400);

}

  var dead=b.el; setTimeout(function(){ dead.remove(); },380);
}

/* ---------- 泡泡雨事件：每 45–75 秒轻轻落一阵小空泡泡 ---------- */
function scheduleRain(){
  clearTimeout(rainTimer);
  if(settings.rainFreq==="off") return;
  rainTimer=setTimeout(function(){
    rainEvent();
    scheduleRain();
  }, settings.rainFreq==="often" ? 20000+Math.random()*15000 : 45000+Math.random()*30000);
}
function rainEvent(){
  var n=8+Math.floor(Math.random()*5); /* 8–12 个 */
  var spawned=0;
  clearTimeout(rainSpawnTimer);
  (function drop(){
    if(spawned>=n) return;
    spawned++;
    var size=26+Math.random()*104; /* 26–130px 宽幅随机，大小混杂不再整齐划一 */
    var x=Math.random()*Math.max(1,(window.innerWidth-size));
    var el=document.createElement("div");
    el.className="bubble rain";
    el.style.width=size+"px"; el.style.height=size+"px";
    el.style.transform="translate("+x+"px,-60px)";
    play.appendChild(el);
    var b={ el:el, x:x, y:-60, vy:30+Math.random()*16, size:size, counted:false, phase:Math.random()*Math.PI*2 };
    el.addEventListener("pointerdown",function(ev){ ev.preventDefault(); ev.stopPropagation(); popRain(b); });
    rainBubbles.push(b);
    rainSpawnTimer=setTimeout(drop, 420+Math.random()*320);
  })();
}

/* ---------- 微风事件：每约 40–80 秒来一阵约 4 秒的微风，全场轻轻吹偏（带极淡风纹线） ---------- */
var breezeTimer=null, breeze={ active:false, dir:1, start:0, until:0 };
function scheduleBreeze(){
  clearTimeout(breezeTimer);
  if(!settings.breeze){ breeze.active=false; return; }
  breezeTimer=setTimeout(function(){
    breeze.active=true; breeze.dir=Math.random()<0.5?-1:1;
    breeze.start=performance.now(); breeze.until=breeze.start+4000;
    spawnWindStreaks(breeze.dir);
    breezeTimer=setTimeout(function(){ breeze.active=false; scheduleBreeze(); },4000);
  }, 40000+Math.random()*40000);
}
function spawnWindStreaks(dir){
  for(var i=0;i<6;i++){
    var d=document.createElement("div"); d.className="wind-line";
    var w=90+Math.random()*110;
    d.style.width=w+"px";
    d.style.top=(8+Math.random()*80)+"%";
    d.style.left= dir>0 ? (-w-20)+"px" : (window.innerWidth+20)+"px";
    fxLayer.appendChild(d);
    var dist=window.innerWidth+w+60;
    d.animate([
      { transform:"translateX(0)", opacity:0 },
      { transform:"translateX("+(dir*dist*0.4)+"px)", opacity:0.8, offset:0.3 },
      { transform:"translateX("+(dir*dist)+"px)", opacity:0 }
    ],{ duration:3400, delay:i*260, easing:"ease-in-out" }).onfinish=(function(el){ return function(){ el.remove(); }; })(d);
  }
}

/* ================= 开始 / 重开 ================= */
function clearPlay(){
  bubbles.forEach(function(b){ b.el.remove(); });
  rainBubbles.forEach(function(b){ b.el.remove(); });
  bubbles=[]; rainBubbles=[]; play.innerHTML="";
  if(rafId) cancelAnimationFrame(rafId); rafId=null;
  clearTimeout(refillTimer); clearTimeout(rainTimer); clearTimeout(rainSpawnTimer);
  clearTimeout(breezeTimer); breeze.active=false;
}
function startGame(){
  clearPlay();
  applyBg(resolveBg());
  themeKey=resolveTheme();
  pool=shuffle(THEMES[themeKey].slice()); poolIdx=0;
  lastTs=0;
  var meta=themeMeta(themeKey);
  var tname = settings.lang==="zh" ? meta[2] : meta[3];
  showBanner(T().bannerTheme+" "+meta[1]+" "+tname, 2600);
  refillLoop();
  scheduleRain();
  scheduleBreeze();
  rafId=requestAnimationFrame(tick);
}
window.addEventListener("resize",function(){ /* 换屏/旋转后数量按新面积走：多了自然飘走，少了自动补 */
  if(bubbles.length<targetCount()) refillLoop();
});

/* ================= 设置界面 ================= */
function segWire(id,key,parse){
  var seg=$(id);
  seg.querySelectorAll("button").forEach(function(btn){
    btn.addEventListener("click",function(){
      settings[key]=parse?parse(btn.dataset.v):btn.dataset.v;
      AudioBox.setEnabled(settings.sound);
      saveSettings(); syncSettingsUI();
      if(key==="theme") startGame();
      if(key==="lang") applyLang();
      if(key==="rainFreq") scheduleRain();
      if(key==="density"||key==="size"||key==="refill"){ if(bubbles.length<targetCount()) refillLoop(); }
    });
  });
}
function syncSeg(id,val){
  $(id).querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", b.dataset.v===String(val)); });
}
function themeName(key){
  if(key==="random") return T().random;
  var m=themeMeta(key); return m[1]+" "+(settings.lang==="zh"?m[2]:m[3]);
}
function bgName(id){
  if(id==="random") return T().random;
  var b=bgById(id); return settings.lang==="zh"?b.zh:b.en;
}
function syncFxChips(){
  document.querySelectorAll("#fxChips .fx-chip").forEach(function(btn){
    btn.classList.toggle("on", fxOn(btn.dataset.fx));
  });
}
function syncBoolChips(){
  document.querySelectorAll(".bool-chip").forEach(function(btn){
    btn.classList.toggle("on", !!settings[btn.dataset.k]);
  });
  /* 动态效果摘要行：已开 n/15（随开关与语言实时刷新） */
  var dynN=0;
  document.querySelectorAll("#bubbleChips .bool-chip").forEach(function(b){ if(b.classList.contains("on")) dynN++; });
  $("dynToggleText").textContent = settings.lang==="zh"
    ? (T().dynGroup+" · "+T().fxOpen+" "+dynN+"/15")
    : (T().dynGroup+" · "+dynN+"/15 "+T().fxOpen);
}
function syncSettingsUI(){
  syncSliders();
  syncFxChips();
  syncBoolChips();
  syncSeg("rainSeg",settings.rainFreq);
  syncSeg("fxSeg",settings.fx);
  syncSeg("langSeg",settings.lang);
  $("themeSummaryText").textContent=themeName(settings.theme);
  $("bgSummaryText").textContent=bgName(settings.bg);
  $("bgSummarySw").style.background = settings.bg==="random" ? "conic-gradient(#f6c6d3,#f9e29c,#c4e6cd,#bfe0f2,#ddd0ee,#f6c6d3)" : bgById(settings.bg).css;
}
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k=el.getAttribute("data-i18n"); if(T()[k]) el.textContent=T()[k];
  });
  document.documentElement.lang = settings.lang==="zh" ? "zh" : "en";
  document.title = settings.lang==="zh" ? "泡泡乐园" : "Bubble Fun";
  syncSettingsUI(); buildPickers();
}
function buildPickers(){
  var tg=$("themeGrid"); tg.innerHTML="";
  var rb=document.createElement("button");
  if(settings.theme==="random") rb.className="on";
  rb.innerHTML='<span class="pg-glyph">🎲</span><span>'+T().random+'</span>';
  rb.addEventListener("click",function(){ settings.theme="random"; saveSettings(); syncSettingsUI(); buildPickers(); startGame(); });
  tg.appendChild(rb);
  THEME_META.forEach(function(m){
    var b=document.createElement("button");
    if(settings.theme===m[0]) b.className="on";
    var gl=document.createElement("span"); gl.className="pg-glyph"; gl.textContent=m[1];
    var tx=document.createElement("span"); tx.textContent=(settings.lang==="zh"?m[2]:m[3])+" · "+THEMES[m[0]].length;
    b.appendChild(gl); b.appendChild(tx);
    b.addEventListener("click",function(){ settings.theme=m[0]; saveSettings(); syncSettingsUI(); buildPickers(); startGame(); });
    tg.appendChild(b);
  });
  var bg=$("bgGrid"); bg.innerHTML="";
  var rb2=document.createElement("button");
  if(settings.bg==="random") rb2.className="on";
  rb2.innerHTML='<span class="pg-sw" style="background:conic-gradient(#f6c6d3,#f9e29c,#c4e6cd,#bfe0f2,#ddd0ee,#f6c6d3)"></span><span>'+T().random+'</span>';
  rb2.addEventListener("click",function(){ settings.bg="random"; saveSettings(); syncSettingsUI(); buildPickers(); applyBg(resolveBg()); });
  bg.appendChild(rb2);
  BGS.forEach(function(bdef){
    var b=document.createElement("button");
    if(settings.bg===bdef.id) b.className="on";
    var sw=document.createElement("span"); sw.className="pg-sw"; sw.style.background=bdef.css;
    var tx=document.createElement("span"); tx.textContent=(settings.lang==="zh"?bdef.zh:bdef.en);
    b.appendChild(sw); b.appendChild(tx);
    b.addEventListener("click",function(){ settings.bg=bdef.id; saveSettings(); syncSettingsUI(); buildPickers(); applyBg(bdef.id); });
    bg.appendChild(b);
  });
}
function openOverlay(id){ $(id).classList.add("open"); }
function closeOverlay(id){ $(id).classList.remove("open"); }

$("btnSettings").addEventListener("click",function(){ AudioBox.unlock(); openOverlay("settingsPanel"); });
$("settingsBack").addEventListener("click",function(){ closeOverlay("settingsPanel"); });
$("settingsDone").addEventListener("click",function(){ closeOverlay("settingsPanel"); });
$("themeSummary").addEventListener("click",function(){ openOverlay("themePicker"); });
$("themeBack").addEventListener("click",function(){ closeOverlay("themePicker"); });
$("bgSummary").addEventListener("click",function(){ openOverlay("bgPicker"); });
$("bgBack").addEventListener("click",function(){ closeOverlay("bgPicker"); });
/* 动态效果展开/收起：只在泡泡 Tab 内占位，整页不滚动；默认收起 */
$("dynToggle").addEventListener("click",function(){
  var grid=$("bubbleChips"), open=grid.hidden;
  grid.hidden=!open;
  $("dynToggle").classList.toggle("open",open);
  $("dynToggle").setAttribute("aria-expanded", open?"true":"false");
});
/* 设置 Tab 切换：顶部 Tab 栏常驻，点哪个显示哪个，其余隐藏 */
document.querySelectorAll("#setTabs button").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll("#setTabs button").forEach(function(x){ x.classList.toggle("on", x===btn); });
    ["bubbles","fx","visual","sound"].forEach(function(t){ $("tab-"+t).hidden = t!==btn.dataset.tab; });
  });
});
$("btnRestart").addEventListener("click",function(){ AudioBox.unlock(); startGame(); });
document.addEventListener("pointerdown",function(){ AudioBox.unlock(); },{ once:true });

/* ---------- 四项滑条：一行式（左标题/中滑条/右数值）、连续可调不吸附档位（步进 0.05） ---------- */
function fmtMult(v){ return "×"+v.toFixed(2); }
function fmtSpeed(v){ return (Math.round(v*100)/100).toString().replace(/\.?0+$/,"")+"×"; }
var SLIDERS={
  speed:  { key:"speedMult",  fmt:fmtSpeed },
  count:  { key:"countMult",  fmt:fmtMult },
  refill: { key:"refillMult", fmt:fmtMult },
  size:   { key:"sizeMult",   fmt:fmtMult }
};
function refreshSliderLabel(which){
  var cfg=SLIDERS[which];
  $(which+"Val").textContent=cfg.fmt(settings[cfg.key]);
}
function syncSliders(){
  for(var which in SLIDERS){
    $(which+"Slider").value=settings[SLIDERS[which].key];
    refreshSliderLabel(which);
  }
}
function setupSlider(which){
  var cfg=SLIDERS[which], inp=$(which+"Slider");
  inp.addEventListener("input",function(){
    var v=parseFloat(inp.value);
    if(isNaN(v)) return;
    if(which==="speed"){ /* 速度拖动即时生效：场上泡泡的基础速度按新旧漂移比同步缩放 */
      var oldDrift=speedCfg().drift;
      settings.speedMult=v;
      var nd=speedCfg().drift;
      if(oldDrift>0) bubbles.forEach(function(b){ b.speedBase*=nd/oldDrift; });
    } else {
      settings[cfg.key]=v;
    }
    refreshSliderLabel(which); saveSettings();
    if(bubbles.length<targetCount()) refillLoop();
  });
}
["speed","count","refill","size"].forEach(setupSlider);
segWire("rainSeg","rainFreq");
segWire("fxSeg","fx");
document.querySelectorAll("#fxChips .fx-chip").forEach(function(btn){
  btn.addEventListener("click",function(){
    var key=btn.dataset.fx;
    if(!settings.fxToggles) settings.fxToggles=JSON.parse(JSON.stringify(FX_TOGGLE_DEFAULTS));
    settings.fxToggles[key]=!fxOn(key);
    saveSettings(); syncFxChips(); syncSettingsUI();
    if(settings.fxToggles[key]) startPreview("pop",key); /* 关→开时自动演示一次该点破特效 */
  });
});
/* 布尔开关网格：碰撞/彩色/速度变化/夸奖/音效/轻音乐/震动 */
function applyColorfulLive(){
  bubbles.forEach(function(b){
    if(b.special) return;
    if(settings.colorful){
      if(!b.color){
        b.color=BUBBLE_COLORS[Math.floor(Math.random()*BUBBLE_COLORS.length)];
        b.el.classList.add("c-"+b.color);
        b.sheen.style.background="radial-gradient(circle at 50% 45%, "+TINTS[b.color]+" 0%, rgba(255,255,255,0) 72%)";
      }
    } else if(b.color){ b.el.classList.remove("c-"+b.color); b.color=null; }
    applyHue(b); /* 色彩流转随彩色开关自动失效/恢复 */
    applyDynFx(b); /* 柔光光晕的颜色随彩色开关刷新 */
  });
}
document.querySelectorAll(".bool-chip").forEach(function(btn){
  btn.addEventListener("click",function(){
    var key=btn.dataset.k;
    settings[key]=!settings[key];
    if(key==="sound") AudioBox.setEnabled(settings.sound);
    if(key==="music") AudioBox.setMusic(settings.music);
    if(key==="colorful") applyColorfulLive();
    if(key==="breathe"||key==="deform") bubbles.forEach(applyLife);
    if(key==="sparkle") bubbles.forEach(applySparkle);
    if(key==="hueFlow") bubbles.forEach(applyHue);
    if(key==="slowSpin") bubbles.forEach(applySpin);
    if(key==="surfRipple"||key==="heartbeat"||key==="yawn"||key==="halo"||key==="gshadow"||key==="orbit"||key==="rainbowEdge"||key==="blow") bubbles.forEach(applyDynFx);
    if(key==="breeze") scheduleBreeze();
    if(key==="shy" && !settings.shy) bubbles.forEach(function(b){ b.shy=false; if(b.blushEls){ b.blushEls.forEach(function(e){ e.remove(); }); b.blushEls=null; } });
    if(key==="panic" && !settings.panic){ panicUntil=0; popTimes=[]; }
    saveSettings(); syncSettingsUI();
    if(settings[key] && DYN_KEYS.indexOf(key)>=0) startPreview("dyn",key); /* 关→开时自动演示一次该动态效果 */
  });
});
segWire("langSeg","lang");

/* ================= 特效演示预览（照记忆翻牌的预览做法） =================
   点破特效（27 个）与泡泡动态效果（15 个）的开关 chip：关→开时自动演示一次；
   点 chip 的名称区可随时重看演示、不改开关状态。演示在独立的全屏透明舞台上播放，
   设置层先淡出隐藏；点任意处提前结束，约 2–2.5 秒后自动恢复设置层（原 Tab 原状态）。
   演示全程不写设置、不影响对局。 */
var DYN_KEYS=["breathe","deform","sparkle","hueFlow","trail","slowSpin","squash","surfRipple","heartbeat","yawn","halo","gshadow","orbit","rainbowEdge","blow"];
var FX_I18N={ confetti:"fxConfetti", stars:"fxStars", hearts:"fxHearts", petals:"fxPetals", ribbons:"fxRibbons", glow:"fxGlow", surprise:"fxSurprise",
  notes:"fxNotes", fireworks:"fxFireworks", butterfly:"fxButterfly", snow:"fxSnow", feather:"fxFeather", candy:"fxCandy", bloom:"fxBloom",
  minibub:"fxMinibub", rainbowArc:"fxRainbowArc", splash:"fxSplash", glitter:"fxGlitter", balloon:"fxBalloon",
  stardust:"fxStardust", raindrops:"fxRaindrops", moonstars:"fxMoonstars", plane:"fxPlane", pinwheel:"fxPinwheel", wreath:"fxWreath", smoke:"fxSmoke", drizzle:"fxDrizzle" };
var DYN_I18N={ breathe:"breathe", deform:"deform", sparkle:"sparkleFx", hueFlow:"hueFlow", trail:"trail", slowSpin:"slowSpin", squash:"squash",
  surfRipple:"surfRipple", heartbeat:"heartbeat", yawn:"yawn", halo:"halo", gshadow:"gshadow", orbit:"orbit", rainbowEdge:"rainbowEdge", blow:"blow" };
var pv={ active:false, timer:null, interval:null, restoreFx:null };
function makeDemoBubble(color){
  var wrap=$("pvBubbleWrap"); wrap.innerHTML="";
  var size=124;
  var el=document.createElement("div");
  el.className="bubble"+(color?(" c-"+color):"");
  el.style.width=size+"px"; el.style.height=size+"px";
  el.style.left=(-size/2)+"px"; el.style.top=(-size/2)+"px";
  var sheen=document.createElement("div"); sheen.className="sheen";
  if(color) sheen.style.background="radial-gradient(circle at 50% 45%, "+TINTS[color]+" 0%, rgba(255,255,255,0) 72%)";
  el.appendChild(sheen);
  var life=document.createElement("div"); life.className="life";
  var mid=document.createElement("div"); mid.className="mid";
  var pulse=document.createElement("div"); pulse.className="pulse";
  var jelly=document.createElement("div"); jelly.className="jelly";
  var item=THEMES[themeKey][Math.floor(Math.random()*THEMES[themeKey].length)];
  var g=document.createElement("span"); g.className="glyph"; g.textContent=item.glyph;
  g.style.fontSize=Math.round(size*0.52)+"px";
  jelly.appendChild(g); pulse.appendChild(jelly); mid.appendChild(pulse); life.appendChild(mid); el.appendChild(life);
  wrap.appendChild(el);
  return { el:el, jelly:jelly, life:life, mid:mid, pulse:pulse, sheen:sheen, glyphEl:g, item:item, size:size, cls:"M", special:false, color:color,
    shineEl:null, twinkleEl:null, hueAnim:null, lifeAnim:null, deformAnim:null, spinAnim:null,
    rippleEl:null, heartAnim:null, yawnAnim:null, haloEl:null, haloColor:null, shadowEl:null, orbitEl:null, edgeEl:null, blowEl:null,
    seedA:Math.random(), seedB:Math.random() };
}
function startPreview(type,key){
  if(pv.active) return;
  pv.active=true;
  $("settingsPanel").classList.add("faded"); /* 设置层先淡出隐藏 */
  $("pvName").textContent = type==="pop" ? (T()[FX_I18N[key]]||key) : (T()[DYN_I18N[key]]||key);
  $("pvLabel").classList.add("on");
  $("previewStage").classList.add("on");
  if(type==="pop") runPopPreview(key); else runDynPreview(key);
  pv.timer=setTimeout(endPreview, type==="pop" ? 2300 : 2600); /* 约 2–2.5 秒后自动恢复设置层 */
}
function endPreview(){
  if(!pv.active) return;
  pv.active=false;
  clearTimeout(pv.timer);
  if(pv.interval){ clearInterval(pv.interval); pv.interval=null; }
  if(pv.restoreFx!=null){ settings.fx=pv.restoreFx; pv.restoreFx=null; }
  $("pvBubbleWrap").innerHTML="";
  $("previewStage").classList.remove("on");
  $("pvLabel").classList.remove("on");
  $("settingsPanel").classList.remove("faded"); /* 恢复设置层：停留在原 Tab、原开关状态 */
}
$("previewStage").addEventListener("pointerdown",function(ev){ ev.preventDefault(); ev.stopPropagation(); endPreview(); }); /* 点任意处提前结束 */
function runPopPreview(key){
  var color=null, c;
  for(c in FX_FAMILY){ if(FX_FAMILY[c].indexOf(key)>=0){ color=c; break; } }
  var b=makeDemoBubble(color); /* 演示泡泡带该特效所属颜色 */
  pv.restoreFx=settings.fx; settings.fx="rich"; /* 演示用全量粒子：只改内存值、从不保存，生成后立即恢复 */
  var rect=b.el.getBoundingClientRect();
  var cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  setTimeout(function(){
    if(!pv.active) return; /* 已被提前结束：设置值已由 endPreview 恢复 */
    spawnRipple(cx-rect.width/2, cy-rect.height/2, rect.width, color==="orange" ? "rgba(250,170,80,.95)" : null);
    if(key==="surprise"){ burstRing(cx,cy); spawnDancer(b.item,cx,cy,true); }
    else if(FX_SPAWN[key]) FX_SPAWN[key](cx,cy);
    b.el.classList.add("popping");
    b.el.style.transform="scale(1.22)";
    setTimeout(function(){ b.el.remove(); },420);
    if(pv.restoreFx!=null){ settings.fx=pv.restoreFx; pv.restoreFx=null; }
  },480);
}
function runDynPreview(key){
  var color = key==="hueFlow" ? "purple" : (Math.random()<0.5 ? "pink" : "blue");
  var b=makeDemoBubble(color);
  /* 让偶发类效果在演示窗口内必然出现：把相位种子拨到周期开头附近 */
  if(key==="surfRipple" || key==="yawn") b.seedB=0.02;
  if(key==="heartbeat") b.seedA=0.02;
  if(key==="blow"){ b.seedA=0.05; b.seedB=0.05; }
  /* 临时只点亮被演示的这一项来套用现有效果函数，套用完立即恢复真实设置（不保存、场上泡泡不受影响） */
  var stash={}, stashColorful=settings.colorful;
  DYN_KEYS.forEach(function(k){ stash[k]=settings[k]; settings[k]=(k===key); });
  settings.colorful=true;
  applyLife(b); applySparkle(b); applyHue(b); applySpin(b); applyDynFx(b);
  DYN_KEYS.forEach(function(k){ settings[k]=stash[k]; });
  settings.colorful=stashColorful;
  if(key==="trail"){ /* 演示泡泡在中央小幅来回漂移，身后不断留下淡淡拖尾 */
    b.el.animate([
      { transform:"translate(-72px,10px)" }, { transform:"translate(72px,-10px)" }, { transform:"translate(-72px,10px)" }
    ],{ duration:2300, iterations:Infinity, easing:"ease-in-out" });
    pv.interval=setInterval(function(){
      var r=b.el.getBoundingClientRect();
      spawnTrail({ x:r.left, y:r.top, size:r.width, special:false, color:color });
    },95);
  } else if(key==="squash"){ /* 每约 0.7 秒沿交替方向压扁一下再弹回 */
    var horiz=false;
    squashBubble(b,true);
    pv.interval=setInterval(function(){ horiz=!horiz; squashBubble(b,horiz); },720);
  }
}
/* chip 名称区 = 预览触发：点名称只看演示、不改开关状态（27 个点破特效 + 15 个动态效果） */
function wirePreviewName(btn,type,key){
  var nameSpan=btn.querySelector("span");
  if(!nameSpan) return;
  nameSpan.classList.add("pv-name");
  nameSpan.addEventListener("click",function(ev){ ev.stopPropagation(); startPreview(type,key); });
}
document.querySelectorAll("#fxChips .fx-chip").forEach(function(btn){ wirePreviewName(btn,"pop",btn.dataset.fx); });
document.querySelectorAll(".bool-chip").forEach(function(btn){
  if(DYN_KEYS.indexOf(btn.dataset.k)>=0) wirePreviewName(btn,"dyn",btn.dataset.k);
});

/* ================= 启动 ================= */
AudioBox.setEnabled(settings.sound);
AudioBox.setMusic(settings.music);
applyLang();
applyBg(resolveBg());
startGame();
</script>
